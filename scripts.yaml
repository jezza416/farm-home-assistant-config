issue_try_fix:
  alias: Issue Try Fix
  mode: single
  fields:
    issue_entity:
      description: Issue binary sensor entity
      example: binary_sensor.issue_water_retic_pump_off
  sequence:
  - variables:
      fix_service: '{{ state_attr(issue_entity, ''fix_service'') }}'
      fix_entity: '{{ state_attr(issue_entity, ''fix_entity'') }}'
      fix_script: '{{ state_attr(issue_entity, ''fix_script'') }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ fix_script not in [none, '''', ''unknown'', ''unavailable'']
          }}

          '
      sequence:
      - action: '{{ fix_script }}'
    - conditions:
      - condition: template
        value_template: "{{ fix_service not in [none, '', 'unknown', 'unavailable']\n
          \  and fix_entity not in [none, '', 'unknown', 'unavailable'] }}\n"
      sequence:
      - target:
          entity_id: '{{ fix_entity }}'
        action: '{{ fix_service }}'
  description: ''
