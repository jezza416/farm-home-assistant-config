- id: '1709240020390'
  alias: Farm Water Output Guard
  description: ''
  triggers:
  - trigger: state
    entity_id: sensor.water_retic_control_retic_meter_current_run_2
  conditions:
  - condition: template
    value_template: "{{ states('sensor.water_retic_control_retic_meter_current_run_2')
