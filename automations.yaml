- id: '1609035055990'
  alias: Farm Water - Bore Max Off Time V2026
  description: ''
  triggers:
  - trigger: time_pattern
    minutes: /5
  conditions:
  - condition: state
    entity_id: switch.bore_pump
    state: 'off'
  - condition: template
    value_template: "{% set last_valid_off = as_timestamp(states('input_datetime.bore_last_valid_off_time'),
      0) %}\n{% set max_off_hours = states('input_number.bore_max_off_hours') | float(999)
      %}\n\n{{\n  is_state('switch.bore_pump', 'off')\n  and last_valid_off > 0\n
      \ and ((as_timestamp(now()) - last_valid_off) / 3600) >= max_off_hours\n}}"
  actions:
  - action: switch.turn_on
    target:
      entity_id: switch.bore_pump
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.bore_last_on_time
    data:
      datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
  - action: notify.mobile_app_jezza_iphone
    data:
      title: Farm Water
      message: Bore started. It had been off for {{ ((as_timestamp(now()) - as_timestamp(states.switch.bore_pump.last_changed))
        / 3600) | round(1) }} hours, over the max off time of {{ states('input_number.bore_max_off_hours')
        | float(0) | round(0) }} hours.
  - action: notify.mobile_app_sm_s731b
    data:
      title: Farm Water
      message: Bore started. It had been off for {{ ((as_timestamp(now()) - as_timestamp(states.switch.bore_pump.last_changed))
        / 3600) | round(1) }} hours, over the max off time of {{ states('input_number.bore_max_off_hours')
        | float(0) | round(0) }} hours.
  mode: single
- id: '1609035777108'
  alias: Farm Water - Reservoir Protection V2026
  description: ''
  triggers:
  - trigger: state
    entity_id: sensor.water_retic_control_tank_level_percent_2
  - trigger: time_pattern
    minutes: /1
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: numeric_state
        entity_id: sensor.water_retic_control_tank_level_percent_2
        below: input_number.reservoir_critical_level
      - condition: state
        entity_id: input_boolean.reservoir_critical_latched
        state: 'off'
      sequence:
      - if:
        - condition: state
          entity_id: valve.water_retic_control_farm_valve
          state: open
        then:
        - action: valve.close_valve
          target:
            entity_id: valve.water_retic_control_farm_valve
      - if:
        - condition: state
          entity_id: valve.water_retic_control_house_valve
          state: open
        then:
        - action: valve.close_valve
          target:
            entity_id: valve.water_retic_control_house_valve
      - if:
        - condition: state
          entity_id: valve.water_retic_control_retic_valve
          state: open
        then:
        - action: valve.close_valve
          target:
            entity_id: valve.water_retic_control_retic_valve
      - if:
        - condition: state
          entity_id: switch.retic_pump
          state: 'on'
        then:
        - action: switch.turn_off
          target:
            entity_id: switch.retic_pump
      - action: input_boolean.turn_on
        target:
          entity_id:
          - input_boolean.reservior_critical_latched
        data: {}
      - action: notify.mobile_app_jezza_iphone
        data:
          title: Farm Water
          message: Critical reservoir level reached at {{ states('sensor.water_retic_control_tank_level_percent_2')
            | float(0) | round(1) }}%. Farm, House, Retic valve and Retic pump have
            been shut down.
      - action: notify.mobile_app_sm_s731b
        data:
          title: Farm Water
          message: Critical reservoir level reached at {{ states('sensor.water_retic_control_tank_level_percent_2')
            | float(0) | round(1) }}%. Farm, House, Retic valve and Retic pump have
            been shut down.
    - conditions:
      - condition: state
        entity_id: input_boolean.resevior_allow_to_run_to_critical
        state: 'off'
      - condition: numeric_state
        entity_id: sensor.water_retic_control_tank_level_percent_2
        below: input_number.reservior_low_low_level
      - condition: state
        entity_id: input_boolean.reservoir_low_low_latched
        state: 'off'
      sequence:
      - if:
        - condition: state
          entity_id: valve.water_retic_control_house_valve
          state: open
        then:
        - action: valve.close_valve
          target:
            entity_id: valve.water_retic_control_house_valve
      - if:
        - condition: state
          entity_id: valve.water_retic_control_retic_valve
          state: open
        then:
        - action: valve.close_valve
          target:
            entity_id: valve.water_retic_control_retic_valve
      - if:
        - condition: state
          entity_id: switch.retic_pump
          state: 'on'
        then:
        - action: switch.turn_off
          target:
            entity_id: switch.retic_pump
      - action: input_boolean.turn_on
        target:
          entity_id:
          - input_boolean.reservior_critical_latched
        data: {}
      - action: notify.mobile_app_jezza_iphone
        data:
          title: Farm Water
          message: Low low reservoir level reached at {{ states('sensor.water_retic_control_tank_level_percent_2')
            | float(0) | round(1) }}%. House and Shed supply have been shut down.
      - action: notify.mobile_app_sm_s731b
        data:
          title: Farm Water
          message: Low low reservoir level reached at {{ states('sensor.water_retic_control_tank_level_percent_2')
            | float(0) | round(1) }}%. House and Shed supply have been shut down.
    - conditions:
      - condition: state
        entity_id: input_boolean.resevior_allow_to_run_to_critical
        state: 'off'
      - condition: numeric_state
        entity_id: sensor.water_retic_control_tank_level_percent_2
        below: input_number.reservoir_low_level
      - condition: state
        entity_id: input_boolean.reservoir_low_latched
        state: 'off'
      sequence:
      - if:
        - condition: state
          entity_id: valve.water_retic_control_farm_valve
          state: open
        then:
        - action: valve.close_valve
          target:
            entity_id: valve.water_retic_control_farm_valve
      - action: input_boolean.turn_on
        target:
          entity_id:
          - input_boolean.reservior_low_latched
        data: {}
      - action: notify.mobile_app_jezza_iphone
        data:
          title: Farm Water
          message: Low reservoir level reached at {{ states('sensor.water_retic_control_tank_level_percent_2')
            | float(0) | round(1) }}%. Farm supply has been shut down.
      - action: notify.mobile_app_sm_s731b
        data:
          title: Farm Water
          message: Low reservoir level reached at {{ states('sensor.water_retic_control_tank_level_percent_2')
            | float(0) | round(1) }}%. Farm supply has been shut down.
    - conditions:
      - condition: state
        entity_id: input_boolean.resevior_allow_to_run_to_critical
        state: 'on'
      - condition: numeric_state
        entity_id: sensor.water_retic_control_tank_level_percent_2
        below: input_number.reservoir_low_level
      - condition: state
        entity_id: input_boolean.reservoir_low_latched
        state: 'off'
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id:
          - input_boolean.reservior_low_latched
        data: {}
      - action: notify.mobile_app_jezza_iphone
        data:
          title: Farm Water
          message: Reservoir is below low level at {{ states('sensor.water_retic_control_tank_level_percent_2')
            | float(0) | round(1) }}%. Run to critical is enabled, so supply is being
            maintained.
      - action: notify.mobile_app_sm_s731b
        data:
          title: Farm Water
          message: Reservoir is below low level at {{ states('sensor.water_retic_control_tank_level_percent_2')
            | float(0) | round(1) }}%. Run to critical is enabled, so supply is being
            maintained.
    - conditions:
      - condition: template
        value_template: "{{\n  states('sensor.water_retic_control_tank_level_percent_2')
          | float(0)\n  >\n  (states('input_number.reservoir_low_level') | float(0)
          + 2)\n}}"
      - condition: state
        entity_id: input_boolean.reservoir_low_latched
        state: 'on'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id:
          - input_boolean.reservior_low_latched
        data: {}
    - conditions:
      - condition: template
        value_template: "{{\n  states('sensor.water_retic_control_tank_level_percent_2')
          | float(0)\n  >\n  (states('input_number.reservior_low_low_level') | float(0)
          + 2)\n}}"
      - condition: state
        entity_id: input_boolean.reservoir_low_low_latched
        state: 'on'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id:
          - input_boolean.reservior_low_low_latched
        data: {}
    - conditions:
      - condition: template
        value_template: "{{\n  states('sensor.water_retic_control_tank_level_percent_2')
          | float(0)\n  >\n  (states('input_number.reservoir_critical_level') | float(0)
          + 5)\n}}"
      - condition: state
        entity_id: input_boolean.reservoir_critical_latched
        state: 'on'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id:
          - input_boolean.reservior_low_low_latched
        data: {}
  mode: single
- id: '1609037447872'
  alias: Farm Water - Bore Control V2026
  description: ''
  triggers:
  - trigger: state
    entity_id: sensor.water_retic_control_tank_level_percent_2
  - trigger: time_pattern
    minutes: /1
  - trigger: state
    entity_id:
    - switch.bore_pump
    from:
    - 'off'
    - 'on'
    id: bore started
  - trigger: state
    entity_id:
    - switch.bore_pump
    id: bore stopped
    from:
    - 'on'
    - 'off'
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: numeric_state
        entity_id: sensor.water_retic_control_tank_level_percent_2
        below: input_number.bore_turn_on_level
      - condition: state
        entity_id: switch.bore_pump
        state: 'off'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.bore_pump
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.bore_last_on_time
        data:
          datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
      - action: notify.mobile_app_jezza_iphone
        data:
          title: Farm Water
          message: Bore started. Reservoir level is {{ states('sensor.water_retic_control_tank_level_percent_2')
            | float(0) | round(1) }}%, below start level of {{ states('input_number.bore_turn_on_level')
            | float(0) | round(1) }}%.
      - action: notify.mobile_app_sm_s731b
        data:
          title: Farm Water
          message: Bore started. Reservoir level is {{ states('sensor.water_retic_control_tank_level_percent_2')
            | float(0) | round(1) }}%, below start level of {{ states('input_number.bore_turn_on_level')
            | float(0) | round(1) }}%.
    - conditions:
      - condition: numeric_state
        entity_id: sensor.water_retic_control_tank_level_percent_2
        above: input_number.bore_turn_off_level
      - condition: state
        entity_id: switch.bore_pump
        state: 'on'
      sequence:
      - action: switch.turn_on
        metadata: {}
        target:
          entity_id: switch.water_retic_control_retic_reset_meter_run_2
        data: {}
      - type: turn_on
        device_id: e233e7f9aa40689298cb1334006d4a44
        entity_id: 9df6bafef78c0e119726e03f5e24d8c3
        domain: switch
      - delay:
          hours: 0
          minutes: 0
          seconds: 5
          milliseconds: 0
      - action: switch.turn_off
        target:
          entity_id: switch.bore_pump
      - action: notify.mobile_app_jezza_iphone
        data:
          title: Farm Water
          message: Bore stopped. Reservoir level is {{ states('sensor.water_retic_control_tank_level_percent_2')
            | float(0) | round(1) }}%, above stop level of {{ states('input_number.bore_turn_off_level')
            | float(0) | round(1) }}%.
      - action: notify.mobile_app_sm_s731b
        data:
          title: Farm Water
          message: Bore stopped. Reservoir level is {{ states('sensor.water_retic_control_tank_level_percent_2')
            | float(0) | round(1) }}%, above stop level of {{ states('input_number.bore_turn_off_level')
            | float(0) | round(1) }}%.
      - condition: template
        value_template: "{% set started = as_timestamp(states('input_datetime.bore_last_on_time'),
          0) %} {% set runtime_minutes = ((as_timestamp(now()) - started) / 60) if
          started > 0 else 0 %} {% set tank_level = states('sensor.water_retic_control_tank_level_percent_2')
          | float(0) %} {% set overflow_active = is_state('binary_sensor.0xa4c138d99d2e150d_water_leak',
          'on') %}\n{{ runtime_minutes >= 90\n   or tank_level >= 99\n   or overflow_active
          }}"
      - variables:
          started: '{{ as_timestamp(states(''input_datetime.bore_last_on_time''),
            0) }}'
          runtime_minutes: "{% if started | float(0) > 0 %}\n  {{ ((as_timestamp(now())
            - started | float(0)) / 60) | round(0) }}\n{% else %}\n  0\n{% endif %}\n"
          tank_level: '{{ states(''sensor.water_retic_control_tank_level_percent_2'')
            | float(0) }}'
          overflow_active: '{{ is_state(''binary_sensor.0xa4c138d99d2e150d_water_leak'',
            ''on'') }}'
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.bore_last_valid_off_time
        data:
          datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
      - action: input_text.set_value
        target:
          entity_id: input_text.bore_last_off_reason
        data:
          value: "{% if overflow_active %}\n  Bore stopped because overflow sensor
            was active.\n{% elif tank_level >= 99 %}\n  Bore stopped because reservoir
            reached {{ tank_level | round(1) }}%.\n{% elif runtime_minutes | float(0)
            >= 90 %}\n  Bore stopped after running for {{ runtime_minutes }} minutes.\n{%
            else %}\n  Bore stopped by valid control logic.\n{% endif %}"
  - choose:
    - conditions:
      - condition: trigger
        id: bore_started
      sequence:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.bore_last_on_time
        data:
          datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
    - conditions:
      - condition: trigger
        id: bore_stopped
      - condition: template
        value_template: "{% set started = as_timestamp(states('input_datetime.bore_last_on_time'),
          0) %} {% set runtime_minutes = ((as_timestamp(now()) - started) / 60) if
          started > 0 else 0 %} {% set tank_level = states('sensor.water_retic_control_tank_level_percent_2')
          | float(0) %} {% set overflow_active = is_state('binary_sensor.0xa4c138d99d2e150d_water_leak',
          'on') %}\n{{ runtime_minutes >= 90\n   or tank_level >= 99\n   or overflow_active
          }}\n"
      sequence:
      - variables:
          started: '{{ as_timestamp(states(''input_datetime.bore_last_on_time''),
            0) }}'
          runtime_minutes: "{% if started | float(0) > 0 %}\n  {{ ((as_timestamp(now())
            - started | float(0)) / 60) | round(0) }}\n{% else %}\n  0\n{% endif %}\n"
          tank_level: '{{ states(''sensor.water_retic_control_tank_level_percent_2'')
            | float(0) }}'
          overflow_active: '{{ is_state(''binary_sensor.0xa4c138d99d2e150d_water_leak'',
            ''on'') }}'
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.bore_last_valid_off_time
        data:
          datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
      - action: input_text.set_value
        target:
          entity_id: input_text.bore_last_off_reason
        data:
          value: "{% if overflow_active %}\n  Bore stopped because overflow sensor
            was active.\n{% elif tank_level >= 99 %}\n  Bore stopped because reservoir
            reached {{ tank_level | round(1) }}%.\n{% elif runtime_minutes | float(0)
            >= 90 %}\n  Bore stopped after running for {{ runtime_minutes }} minutes.\n{%
            else %}\n  Bore stopped by valid control logic.\n{% endif %}"
  mode: single
