- id: '1771632385960'
  alias: Farm Water - Retic Pump Continuous Run Protection
  description: ''
  triggers:
  - trigger: time_pattern
    minutes: /1
  - trigger: state
    entity_id:
    - binary_sensor.retic_pump_running
    - valve.water_retic_control_farm_valve
    - valve.water_retic_control_house_valve
    - valve.water_retic_control_retic_valve
    - switch.retic_pump
    - sensor.retic_pump_2_retic_pump_stage_runtime
  conditions:
  - condition: state
    entity_id: binary_sensor.retic_pump_running
    state: 'on'
  - condition: state
    entity_id: automation.farm_water_retic_pump_use
    state: 'on'
  actions:
  - variables:
      run_minutes: '{{ states(''sensor.retic_pump_2_retic_pump_stage_runtime'') |
        float(0) }}'
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.farm_actions_snoozed
        state: 'off'
      - condition: state
        entity_id: valve.water_retic_control_farm_valve
        state: open
      - condition: template
        value_template: '{{ run_minutes >= states(''input_number.pump_farm_runtime_cutoff'')
          | float(9999) }}'
      sequence:
      - action: valve.close_valve
        target:
          entity_id: valve.water_retic_control_farm_valve
      - delay: 00:00:12
      - action: switch.turn_on
        target:
          entity_id: switch.retic_pump_2_retic_pump_runtime_reset
      - action: notify.mobile_app_jezza_iphone
        data:
          title: Farm Water
          message: Farm valve closed. Pump runtime reached {{ run_minutes | round(0)
            }} min.
          data:
            actions:
            - action: RESET_RUNTIME_FARM
              title: Reset Farm
      - action: notify.mobile_app_sm_s731b
        data:
          title: Farm Water
          message: Farm valve closed. Pump runtime reached {{ run_minutes | round(0)
            }} min.
          data:
            actions:
            - action: RESET_RUNTIME_FARM
              title: Reset Farm
    - conditions:
      - condition: state
        entity_id: input_boolean.house_actions_snoozed
        state: 'off'
      - condition: state
        entity_id: valve.water_retic_control_farm_valve
        state: closed
      - condition: state
        entity_id: valve.water_retic_control_house_valve
        state: open
      - condition: template
        value_template: '{{ run_minutes >= states(''input_number.pump_house_runtime_cutoff'')
          | float(9999) }}'
      sequence:
      - action: valve.close_valve
        target:
          entity_id: valve.water_retic_control_house_valve
      - delay: 00:00:12
      - action: switch.turn_on
        target:
          entity_id: switch.retic_pump_2_retic_pump_runtime_reset
      - action: notify.mobile_app_jezza_iphone
        data:
          title: Farm Water
          message: House valve closed. Pump runtime reached {{ run_minutes | round(0)
            }} min.
          data:
            actions:
            - action: RESET_RUNTIME_HOUSE
              title: Reset House
      - action: notify.mobile_app_sm_s731b
        data:
          title: Farm Water
          message: House valve closed. Pump runtime reached {{ run_minutes | round(0)
            }} min.
          data:
            actions:
            - action: RESET_RUNTIME_HOUSE
              title: Reset House
    - conditions:
      - condition: state
        entity_id: input_boolean.pump_actions_snoozed
        state: 'off'
      - condition: state
        entity_id: valve.water_retic_control_farm_valve
        state: closed
      - condition: state
        entity_id: valve.water_retic_control_house_valve
        state: closed
      - condition: state
        entity_id: valve.water_retic_control_retic_valve
        state: open
      - condition: template
        value_template: '{{ run_minutes >= states(''input_number.pump_shed_runtime_cutoff'')
          | float(9999) }}'
      sequence:
      - action: valve.close_valve
        target:
          entity_id: valve.water_retic_control_retic_valve
      - delay: 00:00:12
      - action: switch.turn_on
        target:
          entity_id: switch.retic_pump_2_retic_pump_runtime_reset
      - action: notify.mobile_app_jezza_iphone
        data:
          title: Farm Water
          message: Retic valve closed. Pump runtime reached {{ run_minutes | round(0)
            }} min.
          data:
            actions:
            - action: RESET_RUNTIME_SHED
              title: Reset Shed
      - action: notify.mobile_app_sm_s731b
        data:
          title: Farm Water
          message: Retic valve closed. Pump runtime reached {{ run_minutes | round(0)
            }} min.
          data:
            actions:
            - action: RESET_RUNTIME_SHED
              title: Reset Shed
    - conditions:
      - condition: state
        entity_id: input_boolean.pump_actions_snoozed
        state: 'off'
      - condition: state
        entity_id: valve.water_retic_control_retic_valve
        state: closed
      - condition: state
        entity_id: switch.retic_pump
        state: 'on'
      - condition: template
        value_template: '{{ run_minutes >= states(''input_number.pump_stand_runtime_cutoff'')
          | float(9999) }}'
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.retic_pump
      - action: switch.turn_on
        target:
          entity_id: switch.retic_pump_2_retic_pump_runtime_reset
      - action: notify.mobile_app_jezza_iphone
        data:
          title: Farm Water
          message: Retic pump turned off. Stand runtime reached {{ run_minutes | round(0)
            }} min.
          data:
            actions:
            - action: RESET_RUNTIME_STAND
              title: Reset Stand
      - action: notify.mobile_app_sm_s731b
        data:
          title: Farm Water
          message: Retic pump turned off. Stand runtime reached {{ run_minutes | round(0)
            }} min.
          data:
            actions:
            - action: RESET_RUNTIME_STAND
              title: Reset Stand
  mode: single
