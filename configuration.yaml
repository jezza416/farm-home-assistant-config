notify:
  - platform: file
    name: stock
    filename: stock.csv
    timestamp: true

  - platform: file
    name: STOCK_DATA
    filename: /config/www/stock_data.txt

  - platform: file
    name: STOCK_SCALE_DATA
    filename: /config/www/stock-scale-data.txt

  - platform: group
    name: Owners
    services:
      - action: mobile_app_jezza_iphone_13
      - action: mobile_app_sm_g780g

sensor:
  - platform: files
    folder: /media/shed_driveway
    filter: "**/*.jpg"
    name: Shed Drive Photos
    sort: date
    recursive: true

  - platform: files
    folder: /media/house_front_door
    filter: "**/*.jpg"
    name: House Front Door Photos
    sort: date
    recursive: false

  - platform: files
    folder: /media/house_driveway
    filter: "**/*.jpg"
    name: House Driveway Photos
    sort: date
    recursive: true

  - platform: files
    folder: /media/shed_mancave
    filter: "**/*.jpg"
    name: Shed Mancave Photos
    sort: date
    recursive: true

  - platform: files
    folder: /media/shed_truckyard
    filter: "**/*.jpg"
    name: Shed Truckyard Photos
    sort: date
    recursive: true

  - platform: statistics
    name: Wind Bearing 3hr Average
    entity_id: sensor.gw2000c_v2_1_8_wind_direction
    state_characteristic: mean
    sampling_size: 30
    max_age:
      hours: 3

  - platform: statistics
    name: Wind Speed 3hr Average
    entity_id: sensor.gw2000c_v2_1_8_wind_speed
    state_characteristic: mean
    sampling_size: 30
    max_age:
      hours: 3

  - platform: statistics
    name: Rain Rate 5min Window
    entity_id: sensor.gw2000c_v2_1_8_yearly_rain_rate_piezo
    state_characteristic: change
    max_age:
      minutes: 5
    sampling_size: 5
    precision: 1

  - platform: statistics
    name: Daily Power Cost Stats
    entity_id: sensor.current_daily_power_cost
    state_characteristic: mean
    sampling_size: 24
    max_age:
      hours: 24

  - platform: statistics
    name: Water Hourly Stats
    entity_id: sensor.water_retic_control_retic_current_hour_2
    state_characteristic: mean
    sampling_size: 24
    max_age:
      hours: 24

  - platform: time_date
    display_options:
      - date

  
utility_meter:
  retic_monthly:
    source: sensor.water_retic_control_retic_current_hour_2
    cycle: monthly
    offset:
      days: 20

