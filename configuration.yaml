    -  /hacsfiles/lovelace-card-mod/card-mod.js?hacstag=190927524421
wake_on_lan:
media_source:

homeassistant:
  media_dirs:
    local: /media

logger:
  default: error
  logs:
    rflink: debug

browser:



alarm_control_panel:
  - platform: manual
    name: Shed Alarm
    arming_time: 5
    delay_time: 5
    trigger_time: 4
    disarmed:
      trigger_time: 0
    armed_home:
      arming_time: 0
      delay_time: 0

cover:
  - platform: template
    covers:
      garage_door:
        device_class: garage
        friendly_name: Shed Yard
        value_template: "{{ is_state('light.truck_yard', 'on') }}"
        open_cover:
          service: light.turn_on
          target:
            entity_id: light.truck_yard
        close_cover:
          service: light.turn_off
          target:
            entity_id: light.truck_yard


