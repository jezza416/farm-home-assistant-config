    #################################################
    # WATER ISOLATION ISSUES
    #################################################

    - name: "Issue Water Farm Isolated By Outgoing Amount"
      unique_id: issue_water_farm_isolated_by_outgoing_amount
      state: >
        {{ is_state('valve.water_retic_control_farm_valve', 'closed')
        and states('sensor.water_retic_control_retic_last_60_farm') | float(0)
          > states('input_number.farm_hourly_water_cutoff') | float(999999) }}
      attributes:
        area: "Water"
        severity: "Warning"
        issue: "Farm water isolated"
        cause: >
          Farm has been isolated because outgoing water reached
          {{ states('sensor.water_retic_control_retic_last_60_farm') | float(0) | round(0) }} L
          in the last 60 minutes.
        fix: "Reset last 60 meter and reopen Farm valve"
        fix_script: "script.water_fix_volume_farm"


    - name: "Issue Water House Isolated By Outgoing Amount"
      unique_id: issue_water_house_isolated_by_outgoing_amount
      state: >
        {{ is_state('valve.water_retic_control_house_valve', 'closed')
        and states('sensor.water_retic_control_retic_last_60_house') | float(0)
          > states('input_number.house_hourly_water_cutoff') | float(999999) }}
      attributes:
        area: "Water"
        severity: "Warning"
        issue: "House water isolated"
        cause: >
          House has been isolated because outgoing water reached
          {{ states('sensor.water_retic_control_retic_last_60_house') | float(0) | round(0) }} L
