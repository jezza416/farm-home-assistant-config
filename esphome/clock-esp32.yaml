                    countdownInmin = id(countdown_state) / 60;
                    countdownInsec = (id(countdown_state) - (countdownInmin * 60));
                    digit0 = countdownInsec % 10;
                    digit1 = countdownInsec / 10;
                  } else {
                    // Timer @ 0... display timer start state
                    ESP_LOGD("main", "Display Setup Time");
                    digit0 = id(countdown_sec) % 10;
                    digit1 = id(countdown_sec) / 10;
                  }
              ESP_LOGD("main", "Time Is Sec: %i", countdownInsec);
              ESP_LOGD("main", "Timer State: %i", id(countdown_state));
              
          } else {
          
          
