esphome:
  name: clock-esp32
  on_boot:
    priority: 200
    then:
      - light.turn_on:
          id: hours_lights
          brightness: 95%
          effect: "LED Time"
      - light.turn_on:
          id: minutes_lights
          brightness: 95%
          effect: "LED Time"


esp32:
  board: wemos_d1_mini32
  framework:
    type: arduino
   


# Enable logging
logger:

# Enable Home Assistant API
api:

ota:
  password: "1355099447122cca30d09f9180c7e028"

wifi:
  networks:
  - ssid: "JezzaRM"
    password: "Zues5399"
  - ssid: "hfpshed"
    password: "hillview199@"

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Clock-Esp32 Fallback Hotspot"
    password: "nkmPPdUzVrnA"

captive_portal:

i2c:
  sda: 21
  scl: 22
  scan: true
  id: bus_a
    
    
sensor:
  - platform: sht3xd
    temperature:
      name: "Kids Clock Temperature"
      id: temp
      on_value:
        then:
          lambda: |-
            id(int_temp) = x;
            id(float_temp) = x;
    humidity:
      name: "Kids Clock Humidity"
    address: 0x44
    update_interval: 60s
    
  - platform: tsl2561
    name: "Kids Ambient Light"
    id: lux
    address: 0x39
    update_interval: 60s
    
switch:
  - platform: template
    name: "Display Temp In Clock"
    id: temp_disp
    restore_state: yes
    turn_on_action:
      - switch.template.publish:
          id: temp_disp
          state: ON
    turn_off_action:
      - switch.template.publish:
          id: temp_disp
          state: OFF
        
  - platform: template
    name: "Countdown Run"
    id: countdown_run
    internal: true
    restore_state: yes
    turn_on_action:
      - switch.template.publish:
          id: countdown_run
          state: ON
      - lambda: |-
           id(countdown_state) = ((id(countdown_min) * 60) + id(countdown_sec));
      - rtttl.play: 'two short:d=4,o=5,b=100:16e6,16e6'
    turn_off_action:
      - switch.template.publish:
          id: countdown_run
          state: OFF
      - rtttl.play: 'MissionImp:d=16,o=6,b=95:32d,32d#,32d,32d#,32d,32d#,32d,32d#,32d,32d,32d#,32e,32f,32f#,32g,g,8p,g,8p,a#,p,c7,p,g,8p,g,8p,f,p,f#,p,g,8p,g,8p,a#,p,c7,p,g,8p,g,8p,f,p,f#,p,a#,g,2d,32p,a#,g,2c#,32p,a#,g,2c,a#5,8c,2p,32p,a#5,g5,2f#,32p,a#5,g5,2f,32p,a#5,g5,2e,d#,8d'
  
  - platform: template
    name: "Countdown Pause"
    id: countdown_pause
    internal: true
    restore_state: yes
    turn_on_action:
      - switch.template.publish:
          id: countdown_pause
          state: ON
      - rtttl.play: 'long:d=1,o=5,b=100:e6'
    turn_off_action:
      - switch.template.publish:
          id: countdown_pause
          state: OFF
      - rtttl.play: 'two short:d=4,o=5,b=100:16e6,16e6'
  
  - platform: template
    name: "Timer Run"
    id: timer_run
    internal: true
    restore_state: yes
    turn_on_action:
      - switch.template.publish:
          id: timer_run
          state: ON
      - lambda: |-
           id(timer_state) = 0;
      - rtttl.play: 'two short:d=4,o=5,b=100:16e6,16e6'
    turn_off_action:
      - switch.template.publish:
          id: timer_run
          state: OFF
      - rtttl.play: 'MissionImp:d=16,o=6,b=95:32d,32d#,32d,32d#,32d,32d#,32d,32d#,32d,32d,32d#,32e,32f,32f#,32g,g,8p,g,8p,a#,p,c7,p,g,8p,g,8p,f,p,f#,p,g,8p,g,8p,a#,p,c7,p,g,8p,g,8p,f,p,f#,p,a#,g,2d,32p,a#,g,2c#,32p,a#,g,2c,a#5,8c,2p,32p,a#5,g5,2f#,32p,a#5,g5,2f,32p,a#5,g5,2e,d#,8d'
  
  
  - platform: template
    name: "Timer Pause"
    id: time_pause
    internal: true
    restore_state: yes
    turn_on_action:
      - switch.template.publish:
