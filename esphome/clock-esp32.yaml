binary_sensor:
  - platform: template
    name: "Time Mode"
    id: time_mode
    internal: false
    filters:
      - delayed_on: 1200ms
    lambda: |-
      if (id(game_mode).state) {
         return false;
      } else if (id(night_light).state){
         return false;
      } else if (id(timer_mode).state){
         return false;
      } else if (id(countdown_mode).state){
         return false;
      } else {   
         return true;
      }
    on_state:
      - light.control:
          id: hours_lights
          state: on
          brightness: 100%
          red: !lambda |- 
             return id(hours_red_value) / 255.0;
          green: !lambda |-
             return id(hours_green_value) / 255.0;
          blue: !lambda |-
             return id(hours_blue_value) / 255.0;
      - light.control:
          id: minutes_lights
          state: on
          brightness: 100%
          red: !lambda |- 
             return id(minutes_red_value) / 255.0;
          green: !lambda |-
             return id(minutes_green_value) / 255.0;
          blue: !lambda |-
             return id(minutes_blue_value) / 255.0;
        
output:
  #======== Hours ============
  - platform: template
    id: hours_red_output
    type: float
    write_action:
      lambda: |-
        if (id(time_mode).state){
          id(hours_red_value) = 255.0 * state;
        } else if (id(game_mode).state){
          id(home_red_value) = 255.0 * state;
