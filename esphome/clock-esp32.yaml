button:
  - platform: template
    name: "Start / Pause"
    on_press:
      - logger.log: Reset Button Pressed
      - lambda: |-
          if (id(countdown_mode).state){      
            if (id(countdown_run).state) {
               // Timer Running
              if (id(countdown_pause).state){
                // Timer Paused...
                id(countdown_pause).turn_off();
              } else {
                // Timer not Paused..
                id(countdown_pause).turn_on();
              }
            } else {
              // Start Timer..
              id(countdown_run).turn_on();
            }  
          }
          if (id(timer_mode).state){      
            if (id(timer_run).state) {
               // Timer Running
              if (id(time_pause).state){
                // Timer Paused...
                id(time_pause).turn_off();
              } else {
                // Timer not Paused..
                id(time_pause).turn_on();
              }
            } else {
              // Start Timer..
              id(timer_run).turn_on();
            }  
          }
      
  - platform: template
    name: "Stop / Reset"
    on_press:
      - logger.log: Reset Button Pressed
      - lambda: |-
          if (id(game_mode).state) {
            id(home_value) = 0;
            id(away_value) = 0;
          }
          if (id(countdown_mode).state) {
              if (id(countdown_run).state){
                id(countdown_run).turn_off();
              } else {
                id(countdown_min) = 0;
                id(countdown_sec) = 0;
              }  
          }
          if (id(timer_mode).state) {
              if (id(timer_run).state){
                id(timer_run).turn_off();
              } else {
                id(timer_state) = 0;
              }  
          }
  - platform: template
    name: "Home +"
    on_press:
      - logger.log: Home + Button Pressed
      - lambda: |-
          if (id(game_mode).state) {
            id(home_value) += 1;
          }
          if (id(countdown_mode).state) { 
            id(countdown_min) += 1;
          }
  - platform: template
    name: "Home -"
    on_press:
      - logger.log: Home - Button Pressed
      - lambda: |-
          if (id(game_mode).state) {
            id(home_value) -= 1;
          }
          if (id(countdown_mode).state) { 
            id(countdown_min) -= 1;
          }
  - platform: template
    name: "Away +"
    on_press:
      - logger.log: Away + Button Pressed
      - lambda: |-
          if (id(game_mode).state) {
            id(away_value) += 1;
          }
          if (id(countdown_mode).state) { 
            id(countdown_sec) += 1;
          }
  - platform: template
    name: "Away -"
    on_press:
      - logger.log: Away - Button Pressed
      - lambda: |-
          if (id(game_mode).state) {
            id(away_value) -= 1;
          } 
          if (id(countdown_mode).state) { 
            id(countdown_sec) -= 1;
          }
time:
  - platform: sntp
    id: sntp_time
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org      
    on_time:
      - seconds: '0-59'
        then:
          - lambda: |-
              if (id(timer_mode).state){
                if (id(timer_run).state){
                   if(id(time_pause).state){
                     // Timer Paused
                   } else {
                     // Timer Running....
                     id(timer_state) += 1;
                   }   
                }
              }  
              if (id(countdown_mode).state){
                if (id(countdown_run).state){
                   if(id(countdown_pause).state){
                     // Timer Paused
                   } else {
                     // Timer Running....
                     id(countdown_state) -= 1;
                   }   
                }
              }  
          
