binary_sensor:
  - platform: gpio
    pin: D0
    name: "Vibration Sensor"
    filters:
      - delayed_off: 100ms

  - platform: gpio
    pin: 
      number: D5
      inverted: True
    name: "Distance Sensor"
    filters:
      - delayed_off: 100ms
      
light:
  - platform: fastled_clockless
    chipset: WS2812
    pin: D3
    num_leds: 60
    rgb_order: BRG
    name: "FastLED WS2811 Light"