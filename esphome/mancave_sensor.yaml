esphome:
  name: mancave_sensor
  platform: ESP8266
  board: d1_mini

wifi:
  ssid: "hfpshed"
  password: "hillview199@"
    
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Mancave Sensor Fallback Hotspot"
    password: "hillview199@"

captive_portal:

# Enable logging
logger:

# Enable Home Assistant API
api:

ota:

#remote_receiver:
