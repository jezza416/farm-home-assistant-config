esphome:
  name: fan_secondary
  platform: ESP8266
  board: esp01_1m

wifi:
  ssid: "hfpshed"
  password: "hillview199@"
  manual_ip:
      static_ip: 192.168.1.191
      gateway: 192.168.1.254
      subnet: 255.255.255.0
      
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Fan Secondary Fallback Hotspot"
    password: "hillview199@"
    
  
captive_portal:

# Enable logging
logger:

# Enable Home Assistant API
api:

ota:

switch:
  - platform: gpio
    pin: GPIO12
    id: relay
    
  - platform: template
    name: "Fan Secondary Relay"
    optimistic: true
    id: fakebutton
    turn_on_action:
    - switch.turn_on: relay
    - light.turn_on: led
    turn_off_action:
    - switch.turn_off: relay
    - light.turn_off: led

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: True
    name: "Fan Secondary Button"
    on_press:
      - switch.toggle: fakebutton

output:
  - platform: esp8266_pwm
    id: pow_green_led
    pin:
      number: GPIO13
      inverted: True

light:
  - platform: monochromatic
    output: pow_green_led
    id: led
    
sensor:
  - platform: dht
    pin: GPIO14
    model: AM2302
    temperature:
      name: "Fan Secondary Temperature"
    humidity:
      name: "Fan Secondary Humidity"
    update_interval: 60s

  
  