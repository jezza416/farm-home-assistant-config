  - platform: template
    name: "Status"
    id: status_text
    on_value:
      then:
      - lambda: |-
          std::string str = (x);
          std::string a ("Got");
          std::string b ("Placed");
          std::size_t founda = str.find(a);
          std::size_t foundb = str.find(b);
          if (founda!=std::string::npos){
            ESP_LOGD("main", "Found Got in String");
            auto call = id(status_led).turn_on();
            call.set_effect("Fault");
            call.perform();
          } else if (foundb!=std::string::npos){
            ESP_LOGD("main", "Found Placed in String");
            auto call = id(status_led).turn_on();
            call.set_effect("Waiting");
            call.perform();
          } else {
            ESP_LOGD("main", "Could not find Got Or Placed in Text");
          }
sensor:       
  
  - platform: hx711
    id: scale_raw
    dout_pin: GPIO16
    clk_pin: GPIO17
    gain: 128
    update_interval: 2s
    accuracy_decimals: 2
    on_value:
      then:
      - lambda: |-
          id(weight0).publish_state(x);
          id(weight_a).publish_state(x);
#    filters:
#      - calibrate_linear:
#          -  15415 -> 0
#          - -15513 -> 20
#      - lambda: |-
#          return x - id(scale_float);
#    unit_of_measurement: kg
    

    
  - platform: template
    name: "Current Weight"
    id: weight0  
    unit_of_measurement: kg
    filters:
      - calibrate_linear:
          - 19000 -> 0
          - -577019 -> 543.81
      - lambda: |-
          return x - id(scale_float);
          
#    - calibrate_linear:
#          - 19000 -> 0
#          - -560163 -> 527
    
  - platform: template
    name: "Current Average Weight"
    id: weight_a  
    unit_of_measurement: kg
    filters:
      - calibrate_linear:
          - 19000 -> 0
          - -577019 -> 543.81
      - sliding_window_moving_average:
          window_size: 10
          send_every: 5
      - lambda: |-
          return x - id(scale_float);
      
    
  - platform: template
    name: "Weight 1"
    id: weight1  
    unit_of_measurement: kg  
    
