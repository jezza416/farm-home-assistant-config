output:
          
  - platform: ledc
    pin: GPIO02
    id: buzzer

rtttl:
  output: buzzer
  
light:

  - platform: fastled_clockless
    id: status_led
    chipset: WS2812B
    pin: GPIO23
    num_leds: 1
    rgb_order: GRB 
    name: "Scale Status LED"
    effects:
      - lambda:
          name: "Fault"
          update_interval: .05s
          lambda: |-
            static int state = 0;
            static float in = 0;
            static float out = 0;
          
            // Scale sin output from -1/1 to 0/1
            out = sin(in) * 0.5 + 0.5;  
 
            auto call = id(status_led).turn_on();
            call.set_transition_length(100);
            // COLOR + BRIGHTNESS
            call.set_rgb(1.0, 0.0, 0.0);
            call.set_brightness(out);
            // Do not publish state to eliminate flooding of logs
            call.set_publish(false);
            call.set_save(false);
            if (state == 0) {
              call.set_rgb(1.0, 0.0, 0.0);
            } else if (state == 150) {
              call.set_effect("Waiting");
            } else {
              ESP_LOGD("main", "Wait %i", state);
            }
            call.perform();
            state += 1;
            if (state == 151)
              state = 0;
          
              // RESOLUTION
            in += 0.314;
            if (in > 6.283){
              in = 0; }
              
            
      - lambda:
          name: "Ready"
          update_interval: 60s
          lambda: |-
            auto call = id(status_led).turn_on();
            call.set_transition_length(10);
            // COLOR + BRIGHTNESS
            call.set_rgb(0.0, 1.0, 0.0);
            call.set_brightness(0.5);
            // Do not publish state to eliminate flooding of logs
            call.set_publish(false);
            call.set_save(false);
            call.perform();
              // RESOLUTION
            
           
      - lambda:
          name: "Waiting"
          update_interval: 5s
          lambda: |-
            static int state = 0;
 
            auto call = id(status_led).turn_on();
            call.set_transition_length(100);
            // COLOR + BRIGHTNESS
            call.set_rgb(0.0, 0.0, 1.0);
            call.set_brightness(0.5);
            // Do not publish state to eliminate flooding of logs
            call.set_publish(false);
            call.set_save(false);
            if (state == 0) {
              call.set_rgb(0.0, 0.0, 1.0);
            } else if (state == 1){
              if (id(status_text).state == "" ){
                id(status_text).publish_state("Startup Done..");
              }
            } else if (state >= 6) {
              id(status_text).publish_state("Ready for Scan..");
            } else {
              ESP_LOGD("main", "Wait %i", state);
            }
            call.perform();
        
            state += 1;
            if (state == 151)
              state = 0;
      - pulse:
      - pulse:
          name: "Fast Pulse"
          transition_length: 0.5s
          update_interval: 0.5s
      - pulse:
          name: "Slow Pulse"
          # transition_length: 1s      # defaults to 1s
          update_interval: 2s
 

    
globals:
  - id: scale_float
    type: float
    restore_value: no
    initial_value: '0'
    
  - id: log_int
    type: int
    restore_value: no
    initial_value: '0'
    