binary_sensor:
  - platform: status
    name: "Scale Status"
    id: wifi_state
    
  - platform: gpio
    pin:
      number: GPIO10
      mode: INPUT_PULLUP
      inverted: true
    name: "Zero Scale Button"
    id: zero_scale
    on_click:
      min_length: 1s
      max_length: 4s
      then:
      - lambda: |-
          if (id(zero_scale_sw).state) {
            id(zero_scale_sw).turn_off();
          } else {
            id(zero_scale_sw).turn_on();
          }
#
#      - switch.turn_on: zero_scale_sw
#    on_double_click:
#      min_length: 50ms
#      max_length: 350ms
#      then:
#        - switch.turn_off: zero_scale_sw
        
  - platform: gpio
    pin:
      number: GPIO33
      mode: INPUT_PULLUP
      inverted: true
    name: "Upload Button"
    id: upload
    on_press:
      - if:
          condition:
            binary_sensor.is_off: zero_scale
          then:
              - switch.turn_on: upload_scale_sw
          else: 
              - switch.turn_on: upload_data_file
 
    
      
switch:
  - platform: template
    name: "Upload Data File"
    id: upload_data_file
    turn_on_action:
      - switch.template.publish:
          id: upload_data_file
          state: ON
      - rtttl.play: "beep:d=8,o=5,b=100:b"
      - lambda: |-
          id(status_text).publish_state("Uploading Started..");
    turn_off_action:
      - rtttl.play: "beep:d=8,o=5,b=100:b"
      - switch.template.publish:
          id: upload_data_file
          state: OFF
      - lambda: |-
          id(status_text).publish_state("Uploading Finshed..");
          
          
  - platform: template
    name: "Zero Scale"
    id: zero_scale_sw
    turn_on_action:
      - switch.template.publish:
          id: zero_scale_sw
          state: ON
      - rtttl.play: "beep:d=8,o=5,b=100:b"
      - lambda: |-
          id(scale_float) = id(weight0).state;
    turn_off_action:
      - lambda: |-
          id(scale_float) = 0;
      - switch.template.publish:
          id: zero_scale_sw
          state: OFF
          
  - platform: template
    name: "Save States"
    id: upload_scale_sw
    turn_on_action:
      - switch.template.publish:
          id: upload_scale_sw
          state: ON
      - rtttl.play: "beep:d=16,o=5,b=100:b"
      - lambda: |-
          if (id(tag0).state == ""){
              id(status_text).publish_state("Need Tag ID!!!");
          } else if (id(tag0).state == "0"){
