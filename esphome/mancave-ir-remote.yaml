esphome:
  name: mancave-ir-remote

esp32:
  board: wemos_d1_mini32
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "YPdU0ZnqDAte0kUc/u0KktDjHIrbwLwWmoX2xBaz3fI="

ota:
  password: "3ac3efc1e64bd8f5f6d5dc1aaf15a1e5"

wifi:
  ssid: hfpshed
  password: hillview199@

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Mancave-Ir-Remote"
    password: "hillview199@"

captive_portal:

remote_transmitter:
  - pin: GPIO16
    carrier_duty_percent: 50%
    id: one
    
  - pin: GPIO17
    carrier_duty_percent: 50%
    id: two

sensor:
  - platform: template
    name: "Matrix Out One"
    id: matrix_1
    update_interval: 60s
 
  - platform: template
    name: "Matrix Out Two"
    id: matrix_2
    update_interval: 60s
    
  - platform: template
    name: "Matrix Out Three"
    id: matrix_3
    update_interval: 60s
    
  - platform: template
    name: "Matrix Out Four"
    id: matrix_4
    update_interval: 60s
       
  - platform: adc
    pin: GPIO33
    name: "Soniq Tv ADC"
    id: soniq_adc
    attenuation: 11db
    update_interval: 28s
    
  - platform: adc
    pin: GPIO35
    name: "Sony Amp ADC"
    attenuation: 11db
    id: sony_adc
    update_interval: 29s
    
  - platform: adc
    pin: GPIO34
    name: "Konic Tv ADC"
    id: konic_adc
    attenuation: 11db
    update_interval: 27s
    
binary_sensor:
  
  - platform: template
    name: "Soniq Tv ON"
    id: soniq_on
    lambda: |-
      if  (id(soniq_adc).state >= 0.13){
      return true;
      } else {
      return false;
      }
    on_release:
      then:
        - lambda: |- 
            id(soniq_mute).publish_state(false);
  
  - platform: template
    name: "Konic Tv ON"
    id: konic_on
    lambda: |-
      if  (id(konic_adc).state >= 0.012){
      return true;
      } else {
      return false;
      }
    on_release:
      then:
        - lambda: |- 
            id(konic_mute).publish_state(false);
  
  - platform: homeassistant
    name: Heater Fixed On
    id: heater_fixed_on
    entity_id: binary_sensor.heater_fixed_running
  
  - platform: homeassistant
    name: Heater Bar On
    id: heater_bar_on
    entity_id: binary_sensor.heater_bar_running
    
script:
  - id: fixed_heater_turn_on
    then:
      - if:
          condition:
            binary_sensor.is_off: heater_fixed_on
          then:
          - logger.log: Command Too Fixed Heater
          - remote_transmitter.transmit_lg:
              transmitter_id: one
              repeat: 
                times: 2
              data: 0x01FE58A7 # power on/off
              nbits: 32
          - delay: 35s
          - logger.log: Delay Finshed Check Heater Fixed Status
          - if:
              condition:
                binary_sensor.is_off: heater_fixed_on
              then:
              - logger.log: Script Restart Turn ON Fixed Heater
              - script.execute: fixed_heater_turn_on
              else:
              - switch.turn_off: fixed_heater_power
              - switch.template.publish:
                  id: fixed_heater_power
                  state: OFF
              - logger.log: Script Turn ON Fixed Heater Completed   
              - script.stop: fixed_heater_turn_on
  
  - id: fixed_heater_turn_off
    then:
      - if:
          condition:
            binary_sensor.is_on: heater_fixed_on
          then:
          - logger.log: Command Too Fixed Heater
          - remote_transmitter.transmit_lg:
              transmitter_id: one
              repeat: 
                times: 2
              data: 0x01FE58A7 # power on/off
              nbits: 32
          - delay: 35s
          - logger.log: Delay Finshed Check Heater Fixed Status
          - if:
              condition:
                binary_sensor.is_on: heater_fixed_on
              then:
              - logger.log: Script Restart Turn OFF Fixed Heater
              - script.execute: fixed_heater_turn_off
              else:
              - switch.turn_off: fixed_heater_power
              - switch.template.publish:
                  id: fixed_heater_power
                  state: OFF
              - logger.log: Script Turn OFF Fixed Heater Completed   
              - script.stop: fixed_heater_turn_off
  
  - id: bar_heater_turn_on
    then:
      - if:
          condition:
            binary_sensor.is_off: heater_bar_on
          then:
          - logger.log: Command To Bar Heater
          - remote_transmitter.transmit_lg:
              transmitter_id: two
              repeat: 
                times: 2
              data: 0x01FE58A7 # power on/off
              nbits: 32
          - delay: 35s
          - logger.log: Delay Finshed Check Heater Bar Status
          - if:
              condition:
                binary_sensor.is_off: heater_bar_on
              then:
              - logger.log: Script Restart Turn ON Bar Heater
              - script.execute: bar_heater_turn_on
              else:
              - switch.turn_off: bar_heater_power
              - switch.template.publish:
                  id: bar_heater_power
                  state: OFF
              - logger.log: Script Turn ON Bar Heater Completed   
              - script.stop: bar_heater_turn_on 
              
  - id: bar_heater_turn_off
    then:
      - if:
          condition:
            binary_sensor.is_on: heater_bar_on
          then:
          - logger.log: Command To Bar Heater
          - remote_transmitter.transmit_lg:
              transmitter_id: two
              repeat: 
                times: 2
              data: 0x01FE58A7 # power on/off
              nbits: 32
          - delay: 35s
          - logger.log: Delay Finshed Check Heater Bar Status
          - if:
              condition:
                binary_sensor.is_on: heater_bar_on
              then:
              - logger.log: Script Restart Turn OFF Bar Heater
              - script.execute: bar_heater_turn_off
              else:
              - switch.turn_off: bar_heater_power
              - switch.template.publish:
                  id: bar_heater_power
                  state: OFF
              - logger.log: Script Turn OFF Bar Heater Completed
              - script.stop: bar_heater_turn_off
switch:
  - platform: restart
    name: Reset Remote
    
  - platform: template
    name: Konic TV Power
    id: konic_power
    icon: "mdi:television"
    turn_on_action:
      - switch.template.publish:
          id: konic_power
          state: ON
      - remote_transmitter.transmit_raw:
              transmitter_id: two
              repeat: 
                times: 2
              code: [9117, -4468, 590, -1659, 589, -521, 591, -520, 589, -520, 593, -519, 590, -519, 593, -519, 590, -521, 592, -518, 592, -1655, 593, -1680, 591, -1630, 590, -1658, 589, -1655, 591, -1656, 590, -1658, 587, -519, 593, -516, 592, -517, 590, -518, 
                     588, -1648, 589, -516, 590, -515, 590, -517, 587, -1657, 587, -1657, 591, -1655, 589, -1653, 590, -519, 590, -1654, 591, -1676, 564, -1654, 591]
              carrier_frequency: 38khz
      - delay: 5s
      - switch.turn_off: konic_power
    turn_off_action:
