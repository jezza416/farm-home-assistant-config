esphome:
  name: mancave-remote
  platform: ESP32
  board: wemos_d1_mini32

wifi:
  ssid: "hfpshed"
  password: "hillview199@"
  #use_address: 192.168.1.207
#  manual_ip:
#    static_ip: 192.168.1.218
#    subnet: 255.255.255.0
#    gateway: 192.168.1.254
    

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Mancave Remote Fallback Hotspot"
    password: "hillview199@"

captive_portal:

# Enable logging
logger:

# Enable Home Assistant API
api:

ota:


remote_transmitter:
  - pin: GPIO16
    carrier_duty_percent: 50%
    id: one
    
  - pin: GPIO17
    carrier_duty_percent: 50%
    id: two

sensor:
  - platform: homeassistant
    name: "Sony Slider"
    id: ha_sony_slider
    entity_id: input_number.sony_volume_slider
    on_value:
      then:
      - if:
          condition:
            lambda: |-
              if (id(ha_sony_slider).state < id(sony_current_vol)){
              return true;
              } else {
              return false;
              }
          then:
            - switch.turn_on: sony_vol_down_auto
            - logger.log: "volume down logged"
      - if:
          condition:
            lambda: |-
              if (id(ha_sony_slider).state > id(sony_current_vol)){
              return true;
              } else {
              return false;
              }
          then:
            - switch.turn_on: sony_vol_up_auto
            - logger.log: "volume up logged"

  - platform: template
    name: "Matrix Out One"
    id: matrix_1
    update_interval: 60s
 
  - platform: template
    name: "Matrix Out Two"
    id: matrix_2
    update_interval: 60s
    
  - platform: template
    name: "Matrix Out Three"
    id: matrix_3
    update_interval: 60s
    
  - platform: template
    name: "Matrix Out Four"
    id: matrix_4
    update_interval: 60s
       
  - platform: adc
    pin: GPIO33
    name: "Soniq Tv ADC"
    id: soniq_adc
    attenuation: 11db
    update_interval: 28s
    
  - platform: adc
    pin: GPIO35
    name: "Sony Amp ADC"
    attenuation: 11db
    id: sony_adc
    update_interval: 29s
    
  - platform: adc
    pin: GPIO34
    name: "Konic Tv ADC"
    id: konic_adc
    attenuation: 11db
    update_interval: 27s
    
binary_sensor:
  
  - platform: template
    name: "Soniq Tv ON"
    id: soniq_on
    lambda: |-
      if  (id(soniq_adc).state >= 0.13){
      return true;
      } else {
      return false;
      }
    on_release:
      then:
        - lambda: |- 
            id(soniq_mute).publish_state(false);
  
  - platform: template
    name: "Konic Tv ON"
    id: konic_on
    lambda: |-
      if  (id(konic_adc).state >= 0.012){
      return true;
      } else {
      return false;
      }
    on_release:
      then:
        - lambda: |- 
            id(konic_mute).publish_state(false);
  - platform: template
    name: "Sony Tv ON"
    id: sony_on
    lambda: |-
      if  (id(sony_adc).state >= 0.50){
      return true;
      } else {
      return false;
      }
    on_press:
      then:
        - delay: 10s
        - lambda: |-
            if (id(sony_input) == 2){
              id(sony_sky).turn_on();
            } else if (id(sony_input) == 1){
                id(sony_cast).turn_on();
            } else {
              id(sony_hd).turn_on();
            }
    on_release:
      then:
        - lambda: |-
            id(sony_cast).publish_state(false);
            id(sony_hd).publish_state(false);
            id(sony_sky).publish_state(false);
            id(sony_mute).publish_state(false);
  
  - platform: homeassistant
    name: Heater Fixed On
    id: heater_fixed_on
    entity_id: binary_sensor.heater_fixed_running
  
  - platform: homeassistant
    name: Heater Bar On
    id: heater_bar_on
    entity_id: binary_sensor.heater_bar_running
    
  
globals:
  - id: sony_current_vol
    type: int
    restore_value: yes
    initial_value: '0'

  - id: sony_input
    type: int
    restore_value: yes
    initial_value: '3'
    
  - id: konic_vol
    type: int
    restore_value: yes
    initial_value: '0'
    
  - id: sony_vol
    type: int
    restore_value: yes
    initial_value: '0'
    
script:
  - id: fixed_heater_turn_on
    then:
      - if:
          condition:
            binary_sensor.is_off: heater_fixed_on
          then:
          - logger.log: Command Too Fixed Heater
          - remote_transmitter.transmit_nec:
              transmitter_id: one
              address: 0x01FE
              command: 0x58A7
          - delay: 35s
          - logger.log: Delay Finshed Check Heater Fixed Status
          - if:
              condition:
                binary_sensor.is_off: heater_fixed_on
              then:
              - logger.log: Script Restart Turn ON Fixed Heater
              - script.execute: fixed_heater_turn_on
              else:
              - switch.turn_off: fixed_heater_power
              - switch.template.publish:
                  id: fixed_heater_power
                  state: OFF
              - logger.log: Script Turn ON Fixed Heater Completed   
              - script.stop: fixed_heater_turn_on
  - id: fixed_heater_turn_off
    then:
      - if:
          condition:
            binary_sensor.is_on: heater_fixed_on
          then:
          - logger.log: Command Too Fixed Heater
          - remote_transmitter.transmit_nec:
              transmitter_id: one
              address: 0x01FE
              command: 0x58A7
          - delay: 35s
          - logger.log: Delay Finshed Check Heater Fixed Status
          - if:
              condition:
                binary_sensor.is_on: heater_fixed_on
              then:
              - logger.log: Script Restart Turn OFF Fixed Heater
              - script.execute: fixed_heater_turn_off
              else:
              - switch.turn_off: fixed_heater_power
              - switch.template.publish:
                  id: fixed_heater_power
                  state: OFF
              - logger.log: Script Turn OFF Fixed Heater Completed   
              - script.stop: fixed_heater_turn_off
  - id: bar_heater_turn_on
    then:
      - if:
          condition:
            binary_sensor.is_off: heater_bar_on
          then:
          - logger.log: Command To Bar Heater
          - remote_transmitter.transmit_nec:
              transmitter_id: two
              address: 0x01FE
              command: 0x58A7
          - delay: 35s
          - logger.log: Delay Finshed Check Heater Bar Status
          - if:
              condition:
                binary_sensor.is_off: heater_bar_on
              then:
              - logger.log: Script Restart Turn ON Bar Heater
              - script.execute: bar_heater_turn_on
              else:
              - switch.turn_off: bar_heater_power
              - switch.template.publish:
                  id: bar_heater_power
                  state: OFF
              - logger.log: Script Turn ON Bar Heater Completed   
              - script.stop: bar_heater_turn_on 
              
  - id: bar_heater_turn_off
    then:
      - if:
          condition:
            binary_sensor.is_on: heater_bar_on
          then:
          - logger.log: Command To Bar Heater
          - remote_transmitter.transmit_nec:
              transmitter_id: two
              address: 0x01FE
              command: 0x58A7
          - delay: 35s
          - logger.log: Delay Finshed Check Heater Bar Status
          - if:
              condition:
                binary_sensor.is_on: heater_bar_on
              then:
              - logger.log: Script Restart Turn OFF Bar Heater
              - script.execute: bar_heater_turn_off
              else:
              - switch.turn_off: bar_heater_power
              - switch.template.publish:
                  id: bar_heater_power
                  state: OFF
              - logger.log: Script Turn OFF Bar Heater Completed
              - script.stop: bar_heater_turn_off
switch:
  - platform: restart
    name: Reset Remote
    
  - platform: template
    id: sony_vol_up_auto
    icon: "mdi:volume-plus"
    turn_on_action:
      - switch.template.publish:
          id: sony_vol_up_auto
          state: ON
      - if:
          condition:
            lambda: |-
              return id(ha_sony_slider).state > id(sony_current_vol);
          then:
          - remote_transmitter.transmit_sony:
              transmitter_id: one
              data: 0x0000240C
              nbits: 15
          - lambda: |- 
              id(sony_current_vol) += 1;
          - logger.log:
              format: "The global sensor reports value %.0i"
              args: [ 'id(sony_current_vol)' ] 
          - delay: 0.7s
          - if:
              condition:
                lambda: |-
                  return id(ha_sony_slider).state > id(sony_current_vol);
              then:
              - switch.turn_on: sony_vol_up_auto
              else:
              - lambda: |-
                  id(ha_sony_slider).publish_state(id(sony_current_vol)); 
              - switch.template.publish:
                  id: sony_vol_up_auto
                  state: OFF
  - platform: template
    id: sony_vol_down_auto
    icon: "mdi:volume-minus"
    turn_on_action:
      - switch.template.publish:
          id: sony_vol_down_auto
          state: ON
      - if:
          condition:
            lambda: |-
              return id(ha_sony_slider).state < id(sony_current_vol);
          then:
          - remote_transmitter.transmit_sony:
              transmitter_id: one
              data: 0x0000640C
              nbits: 15
          - lambda: |- 
              id(sony_current_vol) -= 1;
          - logger.log:
              format: "The global sensor reports value %.1i"
              args: [ 'id(sony_current_vol)' ]   
          - delay: 0.7s
          - if:
              condition:
                lambda: |-
                  return id(ha_sony_slider).state < id(sony_current_vol); 
              then:
              - switch.turn_on: sony_vol_down_auto
              else:
              - lambda: |-
                  id(ha_sony_slider).publish_state(id(sony_current_vol)); 
              - switch.template.publish:
                  id: sony_vol_down_auto
                  state: OFF    
    
