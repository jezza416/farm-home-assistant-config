# Heat Strip
  - platform: template
    name: Heat Strip Power
    id: fixed_heater_power
    icon: "mdi:power"
    turn_on_action:
      - switch.template.publish:
          id: fixed_heater_power
          state: ON
      - if:
          condition:
            or:
              - script.is_running: fixed_heater_turn_on
              - script.is_running: fixed_heater_turn_off
          then:
          - script.stop: fixed_heater_turn_on
          - script.stop: fixed_heater_turn_off
          - logger.log: Fixed Heater Scripts Stopped
          - switch.turn_off: fixed_heater_power
          - switch.template.publish:
              id: fixed_heater_power
              state: OFF
          else:
          - if:
              condition:
                binary_sensor.is_on: heater_fixed_on
              then:
                - logger.log: Start Fixed Heater OFF Script
                - script.execute: fixed_heater_turn_off
              else:
                - logger.log: Start Fixed Heater ON Script
                - script.execute: fixed_heater_turn_on
