# Sony System          
  - platform: template
    name: Sony Audio Power
    id: sony_power
    icon: "mdi:amplifier"
    turn_on_action:
      - switch.template.publish:
          id: sony_power
          state: ON
      - if:
          condition:
            binary_sensor.is_on: sony_on
          then:
          - remote_transmitter.transmit_sony:
              transmitter_id: one
              data: 0x0000540C
              nbits: 15
          - delay: 30s
          - if:
              condition:
                binary_sensor.is_on: sony_on
              then:
              - switch.turn_off: sony_power
              else:
              - switch.template.publish:
                  id: sony_power
                  state: OFF
          else:
          - if:
              condition:
                binary_sensor.is_off: sony_on
              then:
              - remote_transmitter.transmit_sony:
                  transmitter_id: one
                  data: 0x0000540C
                  nbits: 15
              - delay: 30s
              - if:
                  condition:
                    binary_sensor.is_off: sony_on
                  then:
                  - switch.turn_on: sony_power
                  else:
                  - switch.template.publish:
                      id: sony_power
                      state: OFF
              else:
              - switch.template.publish:
                  id: sony_power
                  state: OFF
    turn_off_action:
      - switch.template.publish:
          id: sony_power
          state: ON
      - if:
          condition:
            binary_sensor.is_on: sony_on
          then:
          - remote_transmitter.transmit_sony:
              transmitter_id: one
              data: 0x0000540C
              nbits: 15
          - delay: 30s
          - switch.turn_off: sony_power
          else:
          - switch.template.publish:
              id: sony_power
              state: OFF
  - platform: template
    name: Sony Audio Vol UP
    icon: "mdi:volume-plus"
    turn_on_action:
      - remote_transmitter.transmit_sony:
          repeat:
            times: 10
            wait_time: 500ms
          transmitter_id: one
          data: 0x0000240C
          nbits: 15
  - platform: template
    name: Sony Audio Vol DOWN
    icon: "mdi:volume-minus"
    turn_on_action:
      - remote_transmitter.transmit_sony:
          repeat:
            times: 10
            wait_time: 500ms
          transmitter_id: one
          data: 0x0000640C
          nbits: 15
  - platform: template
    name: Sony Audio Vol MUTE
    id: sony_mute
    icon: "mdi:volume-mute"
    turn_on_action:
      - remote_transmitter.transmit_sony:
          transmitter_id: one
