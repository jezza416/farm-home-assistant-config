esphome:
  name: tent-control
  platform: ESP32
  board: wemos_d1_mini32
  includes:
    - grofan1.h

# Enable logging
logger:

# Enable Home Assistant API
api:

ota:

i2c:
  sda: 22
  scl: 21
  scan: True

wifi:
  ssid: "hfpshed"
  password: "hillview199@"
  manual_ip:
      static_ip: 192.168.1.92
      gateway: 192.168.1.254
      subnet: 255.255.255.0

  # Enable fallback hotspot (captive portal) in case wifi connection fails
