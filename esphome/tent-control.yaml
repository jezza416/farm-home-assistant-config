  - platform: bme680
    temperature:
      name: "Tent Temperature"
      id: wired_temp
      oversampling: 4x
      filters:
      - filter_out: 201.8
      - max:
          window_size: 7
          send_every: 4
          send_first_at: 2
    pressure:
      name: "Tent Pressure"
    humidity:
      name: "Tent Humidity"
      filters:
      - filter_out: 100
      - max:
          window_size: 7
          send_every: 4
          send_first_at: 2
    gas_resistance:
      name: "Tent Gas Resistance"
    address: 0x76
    update_interval: 60s

