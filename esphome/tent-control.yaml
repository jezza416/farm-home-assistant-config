substitutions:
  update_interval_5: 5s
  update_interval_10: 10s
  update_interval_300: 300s

interval:
  - interval: ${update_interval_10}
    then:
      - if:   
          condition:
            or:
            - switch.is_on: tent_heater
            - light.is_on: tent_led
          then:
            - component.update: tent_watts     
      
        
