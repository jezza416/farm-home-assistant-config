i2c:
  - id: i2c_main
    sda: GPIO21
    scl: GPIO22
    scan: true
    frequency: 400kHz

tca9548a:
  - id: tca0
    address: 0x70
    i2c_id: i2c_main
    channels:
      - bus_id: tca_ch0
        channel: 0
      - bus_id: tca_ch1
        channel: 1
      - bus_id: tca_ch2
        channel: 2

mcp23017:
  - id: mcp_hub
    i2c_id: tca_ch0
    address: 0x20

#remote_receiver:
