    name: "Gullwing PWM"
    id: gullwing_pwm
    optimistic: true
    restore_value: true
    min_value: 0.20
    max_value: 1.00
    step: 0.05
    initial_value: 0.75

  - platform: template
    name: "Gullwing Sync Trim"
    id: gullwing_sync_trim
    optimistic: true
    restore_value: true
    min_value: 0.00
    max_value: 0.40
    step: 0.01
    initial_value: 0.12

  - platform: template
    name: "Gullwing Hall Deadband"
    id: gullwing_hall_deadband
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 10

  - platform: template
    name: "Gullwing Current Limit"
    id: gullwing_current_limit
    optimistic: true
    restore_value: true
    min_value: 1.0
    max_value: 20.0
    step: 0.1
