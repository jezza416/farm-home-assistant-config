  - platform: template
    name: "Gullwing End Stop Current"
    id: gullwing_end_stop_current
    optimistic: true
    restore_value: true
    min_value: 0.0
    max_value: 5.0
    step: 0.1
    initial_value: 0.4

  - platform: template
    name: "Gullwing Obstacle Current"
    id: gullwing_obstacle_current
    optimistic: true
    restore_value: true
    min_value: 1.0
    max_value: 25.0
