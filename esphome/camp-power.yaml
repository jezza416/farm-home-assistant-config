#    number: GPIO18
#    mode:
#      input: true
#  dump: all

globals:
  - id: gullwing_is_opening
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: gullwing_is_closing
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: gullwing_target_position
    type: float
    restore_value: no
    initial_value: '0.0'

  - id: gullwing_closed_count
    type: float
    restore_value: yes
    initial_value: '0.0'

  - id: gullwing_open_count
    type: float
    restore_value: yes
    initial_value: '10000.0'

  - id: gullwing_last_avg_count
    type: float
    restore_value: no
    initial_value: '0.0'

  - id: gullwing_no_motion_cycles
    type: int
    restore_value: no
    initial_value: '0'

  - id: gullwing_low_current_cycles
    type: int
    restore_value: no
    initial_value: '0'

  - id: gullwing_high_current_cycles
    type: int
    restore_value: no
    initial_value: '0'

  - id: gullwing_fault_latched
    type: bool
    restore_value: no
    initial_value: 'false'

switch:
  - platform: gpio
    id: relay_gullwing_supply
    name: "Gullwing Relay Supply"
    restore_mode: ALWAYS_OFF
    pin:
      mcp23xxx: mcp_hub
      number: 8
      mode:
        output: true
      inverted: ${relay_active_low}

  - platform: gpio
    id: relay_charging_supply
    name: "Charging Ports Power Supply"
    restore_mode: ALWAYS_ON
    pin:
      mcp23xxx: mcp_hub
      number: 9
      mode:
        output: true
      inverted: False

  - platform: gpio
    id: relay_essential_supply
    name: "Essential Ports Power Supply"
    restore_mode: ALWAYS_ON
    pin:
      mcp23xxx: mcp_hub
      number: 10
      mode:
        output: true
      inverted: False

output:
  - platform: ledc
    id: hbridge1_rpwm
    pin: GPIO25
    frequency: 1000 Hz

  - platform: ledc
    id: hbridge1_lpwm
    pin: GPIO23
    frequency: 1000 Hz

  - platform: ledc
    id: hbridge2_rpwm
    pin: GPIO27
    frequency: 1000 Hz

  - platform: ledc
    id: hbridge2_lpwm
    pin: GPIO17
    frequency: 1000 Hz

sensor:
  - platform: ina260
    i2c_id: tca_ch1
    address: 0x40
    current:
      name: "Gullwing Actuator 1 Current"
      id: ina260_1_current
      accuracy_decimals: 2
    power:
      name: "Gullwing Actuator 1 Power"
      id: ina260_1_power
      accuracy_decimals: 1
    bus_voltage:
      name: "Gullwing Actuator 1 Bus Voltage"
      id: ina260_1_voltage
      accuracy_decimals: 2
    update_interval: 250ms

  - platform: ina260
    i2c_id: tca_ch2
    address: 0x40
    current:
      name: "Gullwing Actuator 2 Current"
      id: ina260_2_current
      accuracy_decimals: 2
    power:
      name: "Gullwing Actuator 2 Power"
      id: ina260_2_power
      accuracy_decimals: 1
    bus_voltage:
      name: "Gullwing Actuator 2 Bus Voltage"
      id: ina260_2_voltage
      accuracy_decimals: 2
    update_interval: 250ms

  - platform: pulse_counter
    pin:
      number: GPIO4
      mode:
        input: true
    id: actuator_1_hall_rate
    internal: true
    update_interval: 250ms
    count_mode:
      rising_edge: INCREMENT
      falling_edge: DISABLE
    total:
      id: actuator_1_hall_total
      internal: true

  - platform: pulse_counter
    pin:
      number: GPIO5
      mode:
        input: true
    id: actuator_2_hall_rate
    internal: true
    update_interval: 250ms
    count_mode:
      rising_edge: INCREMENT
      falling_edge: DISABLE
    total:
      id: actuator_2_hall_total
      internal: true

  - platform: template
    name: "Gullwing Hall Difference"
    id: gullwing_hall_difference
    update_interval: 250ms
    lambda: |-
      return id(actuator_1_hall_total).state - id(actuator_2_hall_total).state;

  - platform: template
    name: "Gullwing Hall Average"
    id: gullwing_hall_average
    update_interval: 250ms
    lambda: |-
      return (id(actuator_1_hall_total).state + id(actuator_2_hall_total).state) / 2.0f;

  - platform: template
    name: "Gullwing Position Percent"
    id: gullwing_position_percent
    unit_of_measurement: "%"
    accuracy_decimals: 1
    update_interval: 250ms
    lambda: |-
      const float span = id(gullwing_open_count) - id(gullwing_closed_count);
      if (span <= 0.0f) return 0.0f;

      float pos = (id(gullwing_hall_average).state - id(gullwing_closed_count)) / span;
      if (pos < 0.0f) pos = 0.0f;
      if (pos > 1.0f) pos = 1.0f;
      return pos * 100.0f;

  - platform: template
    name: "Gullwing Combined Current"
    id: gullwing_combined_current
    unit_of_measurement: "A"
    accuracy_decimals: 2
    update_interval: 250ms
    lambda: |-
      return id(ina260_1_current).state + id(ina260_2_current).state;

  - platform: template
    name: "Actuator 1 Hall Total Count"
    accuracy_decimals: 0
    update_interval: 250ms
    lambda: |-
      return id(actuator_1_hall_total).state;

  - platform: template
    name: "Actuator 2 Hall Total Count"
    accuracy_decimals: 0
    update_interval: 250ms
    lambda: |-
      return id(actuator_2_hall_total).state;

  - platform: template
    name: "Actuator 1 Counts Per mm"
    id: actuator_1_counts_per_mm
    unit_of_measurement: "counts/mm"
    accuracy_decimals: 3
    update_interval: 250ms
    lambda: |-
      const float stroke_mm = id(actuator_1_stroke_length_mm).state;
      const float full_counts = id(actuator_1_full_stroke_pulses).state;

      if (stroke_mm <= 0.0f) return 0.0f;
      return full_counts / stroke_mm;

  - platform: template
    name: "Actuator 1 Stroke mm"
    id: actuator_1_stroke_mm
    unit_of_measurement: "mm"
    accuracy_decimals: 1
    update_interval: 250ms
    lambda: |-
      const float full_counts = id(actuator_1_full_stroke_pulses).state;
      const float stroke_mm = id(actuator_1_stroke_length_mm).state;
      const float current_counts = id(actuator_1_hall_total).state;

      if (full_counts <= 0.0f) return 0.0f;

      float mm = (current_counts / full_counts) * stroke_mm;

      if (mm < 0.0f) mm = 0.0f;
      if (mm > stroke_mm) mm = stroke_mm;

      return mm;

  - platform: template
    name: "Actuator 1 Stroke Percent"
    id: actuator_1_stroke_percent
    unit_of_measurement: "%"
    accuracy_decimals: 1
    update_interval: 250ms
    lambda: |-
      const float full_counts = id(actuator_1_full_stroke_pulses).state;
      const float current_counts = id(actuator_1_hall_total).state;

      if (full_counts <= 0.0f) return 0.0f;

      float pct = (current_counts / full_counts) * 100.0f;

      if (pct < 0.0f) pct = 0.0f;
      if (pct > 100.0f) pct = 100.0f;

      return pct;

  - platform: template
    name: "Actuator 2 Counts Per mm"
    id: actuator_2_counts_per_mm
    unit_of_measurement: "counts/mm"
    accuracy_decimals: 3
    update_interval: 250ms
    lambda: |-
      const float stroke_mm = id(actuator_2_stroke_length_mm).state;
      const float full_counts = id(actuator_2_full_stroke_pulses).state;

      if (stroke_mm <= 0.0f) return 0.0f;
      return full_counts / stroke_mm;

  - platform: template
    name: "Actuator 2 Stroke mm"
    id: actuator_2_stroke_mm
    unit_of_measurement: "mm"
    accuracy_decimals: 1
    update_interval: 250ms
    lambda: |-
      const float full_counts = id(actuator_2_full_stroke_pulses).state;
      const float stroke_mm = id(actuator_2_stroke_length_mm).state;
      const float current_counts = id(actuator_2_hall_total).state;

      if (full_counts <= 0.0f) return 0.0f;

      float mm = (current_counts / full_counts) * stroke_mm;

      if (mm < 0.0f) mm = 0.0f;
      if (mm > stroke_mm) mm = stroke_mm;

      return mm;

  - platform: template
    name: "Actuator 2 Stroke Percent"
    id: actuator_2_stroke_percent
    unit_of_measurement: "%"
    accuracy_decimals: 1
    update_interval: 250ms
    lambda: |-
      const float full_counts = id(actuator_2_full_stroke_pulses).state;
      const float current_counts = id(actuator_2_hall_total).state;

      if (full_counts <= 0.0f) return 0.0f;

      float pct = (current_counts / full_counts) * 100.0f;

      if (pct < 0.0f) pct = 0.0f;
      if (pct > 100.0f) pct = 100.0f;

      return pct;


select:
  - platform: template
    name: "Gullwing Mode"
