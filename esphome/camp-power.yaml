    step: 1
    initial_value: 500

  - platform: template
    name: "Actuator 2 Full Stroke Pulse Count"
    id: actuator_2_full_stroke_pulses
    optimistic: true
    restore_value: true
    min_value: 1
    max_value: 50000
    step: 1
    initial_value: 5000

button:
  - platform: template
    name: "Gullwing Open"
    on_press:
      - script.execute: gullwing_open

  - platform: template
    name: "Gullwing Close"
    on_press:
      - script.execute: gullwing_close

  - platform: template
    name: "Gullwing Stop"
    on_press:
      - script.execute: gullwing_stop

  - platform: template
    name: "Gullwing Set Current As Closed"
    on_press:
      - lambda: |-
          id(gullwing_closed_count) = id(gullwing_hall_average).state;
          ESP_LOGI("gullwing", "Closed count set to %.1f", id(gullwing_closed_count));

  - platform: template
    name: "Gullwing Set Current As Open"
    on_press:
      - lambda: |-
          id(gullwing_open_count) = id(gullwing_hall_average).state;
          ESP_LOGI("gullwing", "Open count set to %.1f", id(gullwing_open_count));

  - platform: template
    name: "Gullwing Clear Fault"
    on_press:
      - lambda: |-
          id(gullwing_fault_latched) = false;
          id(gullwing_no_motion_cycles) = 0;
          id(gullwing_low_current_cycles) = 0;
          id(gullwing_high_current_cycles) = 0;
          ESP_LOGI("gullwing", "Fault cleared");
  
  - platform: template
    name: "Reset Both Actuator Hall Counts"
    on_press:
      - pulse_counter.set_total_pulses:
          id: actuator_1_hall_rate
          value: 0
      - pulse_counter.set_total_pulses:
          id: actuator_2_hall_rate
          value: 0

  - platform: template
    name: "Log Gullwing Counts"
    on_press:
      - lambda: |-
          ESP_LOGI("gullwing", "Actuator 1 total: %.0f", id(actuator_1_hall_total).state);
          ESP_LOGI("gullwing", "Actuator 2 total: %.0f", id(actuator_2_hall_total).state);
          ESP_LOGI("gullwing", "Average total: %.1f", id(gullwing_hall_average).state);

binary_sensor:
  - platform: template
    name: "Gullwing Overcurrent"
    lambda: |-
      return (id(ina260_1_current).state > id(gullwing_current_limit).state) ||
             (id(ina260_2_current).state > id(gullwing_current_limit).state);

  - platform: template
    name: "Gullwing Fault Latched"
    lambda: |-
      return id(gullwing_fault_latched);

script:
  - id: gullwing_stop
    mode: restart
    then:
      - lambda: |-
          id(gullwing_is_opening) = false;
          id(gullwing_is_closing) = false;
          id(gullwing_no_motion_cycles) = 0;
          id(gullwing_low_current_cycles) = 0;
          id(gullwing_high_current_cycles) = 0;
      - output.set_level:
          id: hbridge1_rpwm
          level: 0%
      - output.set_level:
          id: hbridge1_lpwm
          level: 0%
      - output.set_level:
          id: hbridge2_rpwm
          level: 0%
      - output.set_level:
          id: hbridge2_lpwm
          level: 0%
      - delay: 200ms
      - switch.turn_off: relay_gullwing_supply

  - id: gullwing_open
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(gullwing_fault_latched);'
          then:
            - logger.log: "Gullwing fault latched - open blocked"
          else:
            - lambda: |-
                id(gullwing_is_opening) = true;
                id(gullwing_is_closing) = false;
                id(gullwing_no_motion_cycles) = 0;
                id(gullwing_low_current_cycles) = 0;
                id(gullwing_high_current_cycles) = 0;
                id(gullwing_last_avg_count) = id(gullwing_hall_average).state;
            - switch.turn_on: relay_gullwing_supply
            - delay: 200ms

  - id: gullwing_close
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(gullwing_fault_latched);'
          then:
            - logger.log: "Gullwing fault latched - close blocked"
          else:
            - lambda: |-
                id(gullwing_is_opening) = false;
                id(gullwing_is_closing) = true;
                id(gullwing_no_motion_cycles) = 0;
                id(gullwing_low_current_cycles) = 0;
                id(gullwing_high_current_cycles) = 0;
                id(gullwing_last_avg_count) = id(gullwing_hall_average).state;
            - switch.turn_on: relay_gullwing_supply
            - delay: 200ms

  - id: gullwing_rollback
    mode: restart
    then:
      - script.execute: gullwing_stop
      - delay: 300ms
      - lambda: |-
          const float span = id(gullwing_open_count) - id(gullwing_closed_count);
          float current_pos = 0.0f;
          if (span > 0.0f) {
            current_pos = (id(gullwing_hall_average).state - id(gullwing_closed_count)) / span;
          }
          if (current_pos < 0.0f) current_pos = 0.0f;
          if (current_pos > 1.0f) current_pos = 1.0f;

          id(gullwing_target_position) = current_pos + id(gullwing_rollback_percent).state;
          if (id(gullwing_target_position) > 1.0f) id(gullwing_target_position) = 1.0f;
      - script.execute: gullwing_open

cover:
  - platform: template
    name: "Gullwing"
    id: gullwing_cover
    device_class: door
    has_position: true
    assumed_state: false

    lambda: |-
      const float span = id(gullwing_open_count) - id(gullwing_closed_count);
      if (span <= 0.0f) return {};
      float pos = (id(gullwing_hall_average).state - id(gullwing_closed_count)) / span;
      if (pos < 0.0f) pos = 0.0f;
      if (pos > 1.0f) pos = 1.0f;
      return pos;

    open_action:
      - lambda: |-
          id(gullwing_target_position) = 1.0f;
      - script.execute: gullwing_open

    close_action:
      - lambda: |-
          id(gullwing_target_position) = 0.0f;
      - script.execute: gullwing_close

    stop_action:
      - script.execute: gullwing_stop

    position_action:
      - lambda: |-
          id(gullwing_target_position) = pos;

          const float span = id(gullwing_open_count) - id(gullwing_closed_count);
          if (span <= 0.0f) return;

          float current_pos = (id(gullwing_hall_average).state - id(gullwing_closed_count)) / span;
          if (current_pos < 0.0f) current_pos = 0.0f;
          if (current_pos > 1.0f) current_pos = 1.0f;

          const float band = id(gullwing_position_stop_band).state;

          if (id(gullwing_target_position) > current_pos + band) {
            id(gullwing_open).execute();
          } else if (id(gullwing_target_position) < current_pos - band) {
            id(gullwing_close).execute();
          } else {
            id(gullwing_stop).execute();
          }
