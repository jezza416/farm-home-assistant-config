esphome:
  name: retic-pump-2
  friendly_name: Retic Pump 2
  min_version: 2026.4.0

esp8266:
  board: esp01_1m
  board_flash_mode: dout
  restore_from_flash: true
  early_pin_init: false
  framework:
    version: recommended

wifi:
  ssid: "hfpshed"
  password: "hillview199@"
  #use_address: 192.168.1.149
  #use_address: retic_pump.local
  #manual_ip:
  #    static_ip: 192.168.1.184
  #    gateway: 192.168.1.254
  #    subnet: 255.255.255.0
      
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Retic Pump Fallback Hotspot"
    password: "hillview199@"

captive_portal:

# Enable logging
logger:
  baud_rate: 0

uart:
  rx_pin: RX
  baud_rate: 4800
  parity: EVEN

# Enable Home Assistant API
api:
  reboot_timeout: 30min
  max_connections: 2
  max_send_queue: 8

ota:
  - platform: esphome

globals:
  - id: stage_runtime_minutes
    type: float
    restore_value: no
    initial_value: "0"

binary_sensor:
  - platform: status
    name: "Retic Pump Status"
    
  - platform: gpio
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: True
    name: "Retic Pump Button"
    on_press:
      - switch.toggle: fakebutton

  - platform: template
    name: "Retic Pump Running"
    id: retic_pump_running
    filters:
      - delayed_off: 2s
    lambda: |-
      if (isnan(id(power).state)) {
        return {};
      } else if (id(power).state > 0.004) {
        // Running
        return true;
      } else {
        // Not running
        return false;
      }
    on_release:
      - lambda: |-
          id(stage_runtime_minutes) = 0;
      - component.update: stage_runtime_sensor
      
switch:
  - platform: template
    name: "Retic Pump"
    optimistic: true
    id: fakebutton
    turn_on_action:
    - switch.turn_on: relay
    - light.turn_on: led
    turn_off_action:
    - switch.turn_off: relay
    - light.turn_off: led

  - platform: gpio
    id: relay
    pin: GPIO12
    restore_mode: RESTORE_DEFAULT_ON
  
  - platform: template
    name: "Retic Pump Runtime Reset"
    id: reset_stage_runtime
    turn_on_action:
      - switch.template.publish:
          id: reset_stage_runtime
          state: ON
      - lambda: |-
          id(stage_runtime_minutes) = 0;
      - component.update: stage_runtime_sensor
      - delay: 1s
      - switch.template.publish:
          id: reset_stage_runtime
          state: OFF

output:
  - platform: esp8266_pwm
    id: pow_blue_led
    pin:
      number: GPIO13
      inverted: True

light:
  - platform: monochromatic
    output: pow_blue_led
    id: led

sensor:
  - platform: cse7766
    current:
      name: "Retic Pump Current"
    voltage:
      name: "Retic Pump Voltage"
    power:
      name: "Retic Pump Power"
      id: power
      filters:
      - multiply: 0.001
      unit_of_measurement: kW
      on_value_range:
        - above: 0.004
          then:
            - light.turn_on: led
        - below: 0.003
          then:
            - light.turn_off: led
           
  - platform: total_daily_energy
    name: "Retic Pump Daily kWh"
    id: daily_kw
    power_id: power
  
  - platform: template
    name: "Retic Pump Stage Runtime"
    id: stage_runtime_sensor
    unit_of_measurement: "min"
    accuracy_decimals: 1
    update_interval: never
    lambda: |-
      return id(stage_runtime_minutes);

time:
  - platform: sntp
    id: my_time
    on_time:
      seconds: 0
      minutes: 0
      hours: 0
      then:
        lambda: |-
          id(daily_kw).publish_state(0);

interval:
  - interval: 10s
    then:
      - lambda: |-
          if (id(retic_pump_running).state) {
            id(stage_runtime_minutes) += 10.0 / 60.0;
          }
      - component.update: stage_runtime_sensor