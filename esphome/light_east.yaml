esphome:
  name: light_east
  platform: ESP8266
  board: esp01_1m
  board_flash_mode: dout

wifi:
  ssid: "hfpshed"
  password: "hillview199@"
  manual_ip:
      static_ip: 192.168.1.192
      gateway: 192.168.1.254
      subnet: 255.255.255.0

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Light East Fallback Hotspot"
    password: "hillview199@"
    
captive_portal:

# Enable logging
logger:
  baud_rate: 0

uart:
  rx_pin: RX
  baud_rate: 4800

# Enable Home Assistant API
api:

ota:

substitutions:
  update_interval_5: 5s
  update_interval_10: 10s
  update_interval_300: 300s

interval:
  - interval: ${update_interval_5}
    then:
      - if:   
          condition:
            switch.is_on: relay
          then:
            - component.update: power_sensor

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: True
    name: "Light East Button"
    on_press:
      - switch.toggle: fakebutton
  - platform: template
    name: "Light East Running"
    filters:
      - delayed_off: 15s
    lambda: |-
      if (isnan(id(power).state)) {
        return {};
      } else if (id(power).state > 0.004) {
        // Running
        return true;
      } else {
        // Not running
        return false;
      }
switch:
  - platform: template
    name: "Light East Relay"
    optimistic: true
    id: fakebutton
    turn_on_action:
    - switch.turn_on: relay
    - light.turn_on: led
    turn_off_action:
    - switch.turn_off: relay
    - light.turn_off: led
  - platform: gpio
    id: relay
    pin: GPIO12

output:
  - platform: esp8266_pwm
    id: pow_blue_led
    pin:
      number: GPIO13
      inverted: True

light:
  - platform: monochromatic
    output: pow_blue_led
    id: led

sensor:
  - platform: cse7766
    update_interval: ${update_interval_300}
    id: power_sensor
    current:
      name: "Light East Current"
    voltage:
      name: "Light East Voltage"
    power:
      name: "Light East Power"
      id: power
      unit_of_measurement: Watts
      on_value_range:
        - above: 0.004
          then:
            - light.turn_on: led
        - below: 0.003
          then:
            - light.turn_off: led
  
  - platform: template
    name: Light East Kw
    id: kw_power
    lambda: |-
        id(kw_power).publish_state(id(power).state);
        return id(power).state;
    filters:
    - multiply: 0.001
    unit_of_measurement: kW   
    
  - platform: template
    name: Light East Percentage
    id: percentage
    lambda: |-
      x = id(power).state();
      x / 5.66;
      return id(percentage).state;
    update_interval: ${update_interval_300}
    
  - platform: total_daily_energy
    name: "Light East Daily kWh"
    id: daily_kw
    power_id: power

time:
  - platform: sntp
    id: my_time
    on_time:
      seconds: 0
      minutes: 0
      hours: 0
      then:
        lambda: |-
          id(daily_kw).publish_state(0);
          
          
          
          
          
          
          
          
          
          
