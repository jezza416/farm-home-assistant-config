    password: ${ap_password}

captive_portal:

web_server:
  port: 80
  version: 3
  local: true

i2c:
  - id: i2c_main
    sda: GPIO21
    scl: GPIO22
    scan: true
    frequency: 100kHz

tca9548a:
  - id: tca0
    address: 0x70
    i2c_id: i2c_main
    channels:
      - bus_id: tca_ch0
        channel: 0
      - bus_id: tca_ch2
        channel: 2

mcp23017:
  - id: mcp_hub
    i2c_id: i2c_main
    address: 0x20

remote_receiver:
  pin: GPIO32
  dump:
    - rc_switch
  tolerance: 50%
  filter: 250us
  idle: 4ms
  buffer_size: 4kb

