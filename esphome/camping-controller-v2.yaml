output:
  - platform: ledc
    id: hbridge1_rpwm
    pin: GPIO25
    frequency: 1000 Hz

  - platform: ledc
    id: hbridge1_lpwm
    pin: GPIO23
    frequency: 1000 Hz

  - platform: ledc
    id: hbridge2_rpwm
    pin: GPIO27
    frequency: 1000 Hz

  - platform: ledc
    id: hbridge2_lpwm
    pin: GPIO17
    frequency: 1000 Hz

switch:
  - platform: restart
    name: "Camping Controller Restart"
    id: camping_controller_restart

  - platform: gpio
    id: relay_gullwing_supply
    name: "Ram Power Supply"
    restore_mode: ALWAYS_OFF
    pin:
      number: GPIO19
      mode:
        output: true
      inverted: true

  - platform: gpio
    id: relay_charging_supply
    name: "Charging Ports Power Supply"
    restore_mode: ALWAYS_ON
    pin:
      mcp23xxx: mcp_hub
      number: 9
      mode:
        output: true
      inverted: false

  - platform: gpio
    id: relay_essential_supply
    name: "Essential Ports Power Supply"
    restore_mode: ALWAYS_ON
    pin:
      mcp23xxx: mcp_hub
      number: 10
      mode:
        output: true
      inverted: false

  - platform: template
    name: "Gullwing Open"
    id: gullwing_forward
    optimistic: true
    device_class: switch
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - switch.turn_off: gullwing_reverse
      - delay: 200ms
      - if:
          condition:
            and:
              - switch.is_off: gullwing_reverse
              - switch.is_off: ram_2_forward
              - switch.is_off: ram_2_reverse
          then:
            - switch.turn_on: relay_gullwing_supply
      - delay: 300ms
      - switch.template.publish:
          id: gullwing_forward
          state: ON
      - output.set_level:
          id: hbridge1_rpwm
          level: 1.0
      - output.set_level:
          id: hbridge1_lpwm
          level: 0%
      - lambda: |-
          id(gullwing_motion_start_ms) = millis();
          id(gullwing_last_motion_ms) = millis();
          id(gullwing_last_position) = id(gullwing_position_count);
          id(gullwing_active) = true;
    turn_off_action:
      - output.set_level:
          id: hbridge1_rpwm
          level: 0%
      - output.set_level:
          id: hbridge1_lpwm
          level: 0%
      - lambda: |-
          id(gullwing_active) = false;
      - delay: 100ms
      - switch.template.publish:
          id: gullwing_forward
          state: OFF
      - script.execute: gullwing_post_stop_current_updates
      - if:
          condition:
            and:
              - switch.is_off: gullwing_reverse
              - switch.is_off: ram_2_forward
              - switch.is_off: ram_2_reverse
          then:
            - switch.turn_off: relay_gullwing_supply

  - platform: template
    name: "Gullwing Close"
    id: gullwing_reverse
    optimistic: true
    device_class: switch
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - switch.turn_off: gullwing_forward
      - delay: 200ms
      - if:
          condition:
            and:
              - switch.is_off: gullwing_forward
              - switch.is_off: ram_2_forward
              - switch.is_off: ram_2_reverse
          then:
            - switch.turn_on: relay_gullwing_supply
      - delay: 300ms
      - switch.template.publish:
          id: gullwing_reverse
          state: ON
      - output.set_level:
          id: hbridge1_rpwm
          level: 0%
      - output.set_level:
          id: hbridge1_lpwm
          level: 1.0
      - lambda: |-
          id(gullwing_motion_start_ms) = millis();
          id(gullwing_last_motion_ms) = millis();
          id(gullwing_last_position) = id(gullwing_position_count);
          id(gullwing_active) = true;
    turn_off_action:
      - output.set_level:
          id: hbridge1_rpwm
          level: 0%
      - output.set_level:
          id: hbridge1_lpwm
          level: 0%
      - lambda: |-
          id(gullwing_active) = false;
      - delay: 100ms
      - switch.template.publish:
          id: gullwing_reverse
          state: OFF
      - script.execute: gullwing_post_stop_current_updates
      - if:
          condition:
            and:
              - switch.is_off: gullwing_forward
              - switch.is_off: ram_2_forward
              - switch.is_off: ram_2_reverse
          then:
            - switch.turn_off: relay_gullwing_supply

  - platform: template
    name: "Ram 2 Open"
    id: ram_2_forward
    optimistic: true
    device_class: switch
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - switch.turn_off: ram_2_reverse
      - delay: 200ms
      - switch.turn_on: relay_gullwing_supply
      - delay: 300ms
      - switch.template.publish:
          id: ram_2_forward
          state: ON
      - output.set_level:
          id: hbridge2_rpwm
          level: 1.0
      - output.set_level:
          id: hbridge2_lpwm
          level: 0%
      - lambda: |-
          id(ram_2_motion_start_ms) = millis();
          id(ram_2_last_motion_ms) = millis();
          id(ram_2_last_position) = id(ram_2_position_count);
          id(ram_2_active) = true;
    turn_off_action:
      - output.set_level:
          id: hbridge2_rpwm
          level: 0%
      - output.set_level:
          id: hbridge2_lpwm
          level: 0%
      - lambda: |-
          id(ram_2_active) = false;
      - delay: 100ms
      - switch.template.publish:
          id: ram_2_forward
          state: OFF
      - if:
          condition:
            and:
              - switch.is_off: gullwing_forward
              - switch.is_off: gullwing_reverse
              - switch.is_off: ram_2_reverse
          then:
            - switch.turn_off: relay_gullwing_supply

  - platform: template
    name: "Ram 2 Close"
    id: ram_2_reverse
    optimistic: true
    device_class: switch
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - switch.turn_off: ram_2_forward
      - delay: 200ms
      - switch.turn_on: relay_gullwing_supply
      - delay: 300ms
      - switch.template.publish:
          id: ram_2_reverse
          state: ON
      - output.set_level:
          id: hbridge2_rpwm
          level: 0%
      - output.set_level:
          id: hbridge2_lpwm
          level: 1.0
      - lambda: |-
          id(ram_2_motion_start_ms) = millis();
          id(ram_2_last_motion_ms) = millis();
          id(ram_2_last_position) = id(ram_2_position_count);
          id(ram_2_active) = true;
    turn_off_action:
      - output.set_level:
          id: hbridge2_rpwm
          level: 0%
      - output.set_level:
          id: hbridge2_lpwm
          level: 0%
      - lambda: |-
          id(ram_2_active) = false;
      - delay: 100ms
      - switch.template.publish:
          id: ram_2_reverse
          state: OFF
      - if:
          condition:
            and:
              - switch.is_off: gullwing_forward
              - switch.is_off: gullwing_reverse
              - switch.is_off: ram_2_forward
          then:
            - switch.turn_off: relay_gullwing_supply

