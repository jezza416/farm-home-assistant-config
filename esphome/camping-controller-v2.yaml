substitutions:
  wifi_ssid: "hfpshed"
  wifi_password: "hillview199@"
  ap_password: "hillview199@"

esphome:
  name: camping-controller-v2
  friendly_name: camping-controller-v2
  on_boot:
    priority: -10
    then:
      - lambda: |-
          id(gullwing_encoder).set_value(id(gullwing_position_count));
          id(ram_2_encoder).set_value(id(ram_2_position_count));
          id(gullwing_position_trusted) = false;
          id(ram_2_position_trusted) = false;

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# IO_0
# IO_2
# IO_4
# IO_5
# IO12
# IO13
# IO14
# IO15
# IO16 - Hall 2 b
# IO17 - LPWM 2
# IO18
# IO19 - Relay Ram Power Supply
# IO21 - SDA - TCA & MCP
# IO22 - SCL - TCA & MCP
# IO23 - LPWM 1
# IO25 - RPWM 1
# IO26
# IO27 - RPWM 2
# IO32 - RF Receiver
# IO33
# IO34 - Hall 2 a
# IO35 - Hall 1 a
# IO36 (SVP)
# IO39 - Hall 1 b
# SVN
# TXD
# RXD

