    internal: true
    rc_switch_raw:
      code: "00111101011100101011010"
      protocol: 1
    on_press:
      - logger.log: "RF CH2 STOP received -> Ram 2 Stop"
      - switch.turn_off: ram_2_forward
      - switch.turn_off: ram_2_reverse

  - platform: remote_receiver
    name: "RF CH3 Up"
    internal: true
    rc_switch_raw:
      code: "00111101011100101111010"
      protocol: 1
    on_press:
      - logger.log: "RF CH3 UP received -> Toggle charging ports"
      - switch.toggle: relay_charging_supply

  - platform: remote_receiver
    name: "RF CH3 Down"
    internal: true
    rc_switch_raw:
      code: "00111101011100101110110"
      protocol: 1
    on_press:
      - logger.log: "RF CH3 DOWN received -> Toggle essential ports"
      - switch.toggle: relay_essential_supply

sensor:
  - platform: ina260
    id: ina260_1_sensor
    i2c_id: tca_ch2
    address: 0x40
    current:
      name: "Gullwing Current"
      id: ina260_1_current
      accuracy_decimals: 2
    power:
      name: "Gullwing Power"
      id: ina260_1_power
      accuracy_decimals: 1
    bus_voltage:
      name: "Gullwing Bus Voltage"
      id: ina260_1_voltage
      accuracy_decimals: 2
    update_interval: never

  - platform: ina260
    id: ina260_2_sensor
    i2c_id: tca_ch0
    address: 0x40
    current:
      name: "Ram 2 Current"
      id: ina260_2_current
      accuracy_decimals: 2
    power:
      name: "Ram 2 Power"
      id: ina260_2_power
      accuracy_decimals: 1
    bus_voltage:
      name: "Ram 2 Bus Voltage"
      id: ina260_2_voltage
      accuracy_decimals: 2
    update_interval: never

  - platform: rotary_encoder
    id: gullwing_encoder
    name: "Gullwing Position Count"
    pin_a:
      number: GPIO35
      mode:
        input: true
    pin_b:
      number: GPIO39
      mode:
        input: true
    resolution: 1
    restore_mode: ALWAYS_ZERO
    on_value:
      then:
        - lambda: |-
            id(gullwing_position_count) = (int)x;

  - platform: rotary_encoder
    id: ram_2_encoder
    name: "Ram 2 Position Count"
    pin_a:
      number: GPIO34
      mode:
        input: true
    pin_b:
      number: GPIO16
      mode:
        input: true
    resolution: 1
    restore_mode: ALWAYS_ZERO
    on_value:
      then:
        - lambda: |-
            id(ram_2_position_count) = (int)x;

  - platform: template
    name: "Gullwing Stroke mm"
    id: gullwing_stroke_mm
    unit_of_measurement: "mm"
    accuracy_decimals: 1
    update_interval: never
    lambda: |-
      const float full_counts = id(gullwing_full_stroke_pulses);
      const float stroke_mm = 500.0f;
      float current_counts = id(gullwing_position_count);

      if (current_counts < 0.0f) current_counts = 0.0f;
      if (current_counts > full_counts) current_counts = full_counts;
      if (full_counts <= 0.0f) return 0.0f;

      return (current_counts / full_counts) * stroke_mm;

  - platform: template
    name: "Gullwing Stroke Percent"
    id: gullwing_stroke_percent
    unit_of_measurement: "%"
    accuracy_decimals: 1
    update_interval: never
    lambda: |-
      const float full_counts = id(gullwing_full_stroke_pulses);
      float current_counts = id(gullwing_position_count);

      if (current_counts < 0.0f) current_counts = 0.0f;
      if (current_counts > full_counts) current_counts = full_counts;
      if (full_counts <= 0.0f) return 0.0f;

      return (current_counts / full_counts) * 100.0f;

  - platform: template
    name: "Ram 2 Stroke mm"
    id: ram_2_stroke_mm
    unit_of_measurement: "mm"
    accuracy_decimals: 1
    update_interval: never
    lambda: |-
      const float full_counts = id(ram_2_full_stroke_pulses);
      const float stroke_mm = 500.0f;
      float current_counts = id(ram_2_position_count);

      if (current_counts < 0.0f) current_counts = 0.0f;
      if (current_counts > full_counts) current_counts = full_counts;
      if (full_counts <= 0.0f) return 0.0f;

      return (current_counts / full_counts) * stroke_mm;

  - platform: template
    name: "Ram 2 Stroke Percent"
    id: ram_2_stroke_percent
    unit_of_measurement: "%"
    accuracy_decimals: 1
    update_interval: never
    lambda: |-
      const float full_counts = id(ram_2_full_stroke_pulses);
      float current_counts = id(ram_2_position_count);

      if (current_counts < 0.0f) current_counts = 0.0f;
      if (current_counts > full_counts) current_counts = full_counts;
      if (full_counts <= 0.0f) return 0.0f;

      return (current_counts / full_counts) * 100.0f;

button:
  - platform: template
    name: "Set Gullwing Closed Position"
    on_press:
      - switch.turn_off: gullwing_forward
      - switch.turn_off: gullwing_reverse
      - lambda: |-
          id(gullwing_position_count) = 0;
          id(gullwing_position_trusted) = true;
      - sensor.rotary_encoder.set_value:
          id: gullwing_encoder
          value: 0

  - platform: template
    name: "Set Gullwing Open Position"
    on_press:
      - switch.turn_off: gullwing_forward
      - switch.turn_off: gullwing_reverse
      - lambda: |-
          id(gullwing_position_count) = (int) id(gullwing_full_stroke_pulses);
          id(gullwing_position_trusted) = true;
      - sensor.rotary_encoder.set_value:
          id: gullwing_encoder
          value: !lambda 'return (int) id(gullwing_full_stroke_pulses);'

  - platform: template
    name: "Set Ram 2 Closed Position"
    on_press:
      - switch.turn_off: ram_2_forward
      - switch.turn_off: ram_2_reverse
      - lambda: |-
          id(ram_2_position_count) = 0;
          id(ram_2_position_trusted) = true;
      - sensor.rotary_encoder.set_value:
          id: ram_2_encoder
          value: 0

  - platform: template
    name: "Set Ram 2 Open Position"
    on_press:
      - switch.turn_off: ram_2_forward
      - switch.turn_off: ram_2_reverse
      - lambda: |-
          id(ram_2_position_count) = (int) id(ram_2_full_stroke_pulses);
          id(ram_2_position_trusted) = true;
      - sensor.rotary_encoder.set_value:
          id: ram_2_encoder
          value: !lambda 'return (int) id(ram_2_full_stroke_pulses);'

script:
  - id: gullwing_open_overcurrent_recover
    mode: restart
    then:
      - lambda: |-
          id(gullwing_current_safety_active) = true;
      - switch.turn_off: gullwing_forward
      - delay: 150ms
      - switch.turn_on: gullwing_reverse
      - delay: 5s
      - switch.turn_off: gullwing_reverse
      - lambda: |-
          id(gullwing_current_safety_active) = false;

  - id: gullwing_close_overcurrent_recover
    mode: restart
    then:
      - lambda: |-
          id(gullwing_current_safety_active) = true;
      - switch.turn_off: gullwing_reverse
      - delay: 150ms
      - switch.turn_on: gullwing_forward
      - delay: 5s
      - switch.turn_off: gullwing_forward
      - lambda: |-
          id(gullwing_current_safety_active) = false;

  - id: gullwing_post_stop_current_updates
    mode: restart
    then:
      - repeat:
          count: 20
          then:
            - component.update: ina260_1_sensor
            - delay: 250ms

interval:
  - interval: 100ms
    then:
      - lambda: |-
          const int movement_threshold = 1;
          const unsigned long now = millis();
          const int pos = id(gullwing_position_count);

          const bool opening = id(gullwing_forward).state;
          const bool closing = id(gullwing_reverse).state;
          const bool moving = id(gullwing_active);

          if (!moving) {
            id(gullwing_last_position) = pos;
            return;
          }

          if (id(gullwing_current_safety_active)) {
            id(gullwing_last_position) = pos;
            return;
          }

          const bool current_armed =
            (now - id(gullwing_motion_start_ms)) >= 800;

          if (current_armed) {
            const float current_a = id(ina260_1_current).state;
            const bool close_safety_zone_active = pos > 800;

            if (opening && !isnan(current_a) &&
                current_a > id(gullwing_open_overcurrent_threshold)) {
              id(gullwing_open_overcurrent_recover).execute();
              return;
            }

            if (closing && close_safety_zone_active && !isnan(current_a) &&
                current_a > id(gullwing_close_overcurrent_threshold)) {
              id(gullwing_close_overcurrent_recover).execute();
              return;
            }
          }

          if (abs(pos - id(gullwing_last_position)) > movement_threshold) {
            id(gullwing_last_motion_ms) = now;
          }

          id(gullwing_last_position) = pos;

          const bool armed =
            (now - id(gullwing_motion_start_ms)) >= (unsigned long) id(gullwing_stall_arm_ms);

          const bool stalled =
            (now - id(gullwing_last_motion_ms)) >= (unsigned long) id(gullwing_stall_timeout_ms);

          if (!armed || !stalled) {
            return;
          }

          if (opening) {
            const int learned_open_position = (int) id(gullwing_full_stroke_pulses);

            ESP_LOGD("gullwing_endstop",
                     "Gullwing opening stalled at %d, stopping and setting open position to %d",
                     pos, learned_open_position);

            id(gullwing_forward).turn_off();
            id(gullwing_position_count) = learned_open_position;
            id(gullwing_encoder).set_value(learned_open_position);
            id(gullwing_position_trusted) = true;
            return;
          }

          if (closing) {
            ESP_LOGD("gullwing_endstop",
                     "Gullwing closing stalled at %d, stopping and zeroing",
                     pos);

            id(gullwing_reverse).turn_off();
            id(gullwing_position_count) = 0;
            id(gullwing_encoder).set_value(0);
            id(gullwing_position_trusted) = true;
            return;
          }

  - interval: 100ms
    then:
      - lambda: |-
          const int movement_threshold = 1;
          const unsigned long now = millis();
          const int pos = id(ram_2_position_count);

          const bool opening = id(ram_2_forward).state;
          const bool closing = id(ram_2_reverse).state;
          const bool moving = id(ram_2_active);

          if (!moving) {
            id(ram_2_last_position) = pos;
            return;
          }

          if (abs(pos - id(ram_2_last_position)) > movement_threshold) {
            id(ram_2_last_motion_ms) = now;
          }

          id(ram_2_last_position) = pos;

          const bool armed =
            (now - id(ram_2_motion_start_ms)) >= (unsigned long) id(ram_2_stall_arm_ms);

          const bool stalled =
            (now - id(ram_2_last_motion_ms)) >= (unsigned long) id(ram_2_stall_timeout_ms);

          if (!armed || !stalled) {
            return;
          }

          if (opening) {
            const int learned_open_position = (int) id(ram_2_full_stroke_pulses);

            ESP_LOGD("ram2_endstop",
                     "Ram 2 opening stalled at %d, stopping and setting open position to %d",
                     pos, learned_open_position);

            id(ram_2_forward).turn_off();
            id(ram_2_position_count) = learned_open_position;
            id(ram_2_encoder).set_value(learned_open_position);
            id(ram_2_position_trusted) = true;
            return;
          }

          if (closing) {
            ESP_LOGD("ram2_endstop",
                     "Ram 2 closing stalled at %d, stopping and zeroing",
                     pos);

            id(ram_2_reverse).turn_off();
            id(ram_2_position_count) = 0;
            id(ram_2_encoder).set_value(0);
            id(ram_2_position_trusted) = true;
            return;
          }

  - interval: 250ms
    then:
      - lambda: |-
          const float stroke_mm = 500.0f;
          unsigned long now = millis();

          bool gullwing_moving = id(gullwing_forward).state || id(gullwing_reverse).state;
          bool ram2_moving = id(ram_2_forward).state || id(ram_2_reverse).state;

          float gullwing_counts = id(gullwing_position_count);
          float gullwing_full = id(gullwing_full_stroke_pulses);
          if (gullwing_counts < 0.0f) gullwing_counts = 0.0f;
          if (gullwing_full > 0.0f && gullwing_counts > gullwing_full) gullwing_counts = gullwing_full;
          float gullwing_mm = (gullwing_full > 0.0f) ? ((gullwing_counts / gullwing_full) * stroke_mm) : 0.0f;
          float gullwing_pct = (gullwing_full > 0.0f) ? ((gullwing_counts / gullwing_full) * 100.0f) : 0.0f;

          float ram2_counts = id(ram_2_position_count);
          float ram2_full = id(ram_2_full_stroke_pulses);
          if (ram2_counts < 0.0f) ram2_counts = 0.0f;
          if (ram2_full > 0.0f && ram2_counts > ram2_full) ram2_counts = ram2_full;
          float ram2_mm = (ram2_full > 0.0f) ? ((ram2_counts / ram2_full) * stroke_mm) : 0.0f;
          float ram2_pct = (ram2_full > 0.0f) ? ((ram2_counts / ram2_full) * 100.0f) : 0.0f;

          if (gullwing_moving) {
            if (now - id(gullwing_last_fast_publish) >= 500) {
              id(gullwing_stroke_mm).publish_state(gullwing_mm);
              id(gullwing_stroke_percent).publish_state(gullwing_pct);
              id(gullwing_last_fast_publish) = now;
            }
          } else {
            if (now - id(gullwing_last_slow_publish) >= 600000) {
              id(gullwing_stroke_mm).publish_state(gullwing_mm);
              id(gullwing_stroke_percent).publish_state(gullwing_pct);
              id(gullwing_last_slow_publish) = now;
            }
          }

          if (ram2_moving) {
            if (now - id(ram_2_last_fast_publish) >= 500) {
              id(ram_2_stroke_mm).publish_state(ram2_mm);
              id(ram_2_stroke_percent).publish_state(ram2_pct);
              id(ram_2_last_fast_publish) = now;
            }
          } else {
            if (now - id(ram_2_last_slow_publish) >= 600000) {
              id(ram_2_stroke_mm).publish_state(ram2_mm);
              id(ram_2_stroke_percent).publish_state(ram2_pct);
              id(ram_2_last_slow_publish) = now;
            }
          }
      - if:
          condition:
            lambda: |-
              return id(gullwing_forward).state || id(gullwing_reverse).state;
          then:
            - component.update: ina260_1_sensor

      - if:
          condition:
            lambda: |-
              return id(ram_2_forward).state || id(ram_2_reverse).state;
          then:
            - component.update: ina260_2_sensor