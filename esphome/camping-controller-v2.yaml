  - platform: remote_receiver
    name: "RF CH1 Up"
    internal: true
    rc_switch_raw:
      code: "00111101011100101010110"
      protocol: 1
    on_press:
      - logger.log: "RF CH1 UP received -> Gullwing Open"
      - switch.turn_off: gullwing_reverse
      - switch.turn_on: gullwing_forward

  - platform: remote_receiver
    name: "RF CH1 Down"
    internal: true
    rc_switch_raw:
      code: "00111101011100101010010"
      protocol: 1
    on_press:
      - logger.log: "RF CH1 DOWN received -> Gullwing Close"
      - switch.turn_off: gullwing_forward
      - switch.turn_on: gullwing_reverse

  - platform: remote_receiver
    name: "RF CH1 Stop"
    internal: true
    rc_switch_raw:
      code: "00111101011100101111100"
      protocol: 1
    on_press:
      - logger.log: "RF CH1 STOP received -> Gullwing Stop"
      - switch.turn_off: gullwing_forward
      - switch.turn_off: gullwing_reverse

  - platform: remote_receiver
    name: "RF CH2 Up"
    internal: true
    rc_switch_raw:
      code: "00111101011100101011100"
      protocol: 1
    on_press:
      - logger.log: "RF CH2 UP received -> Ram 2 Open"
      - switch.turn_off: ram_2_reverse
      - switch.turn_on: ram_2_forward

  - platform: remote_receiver
