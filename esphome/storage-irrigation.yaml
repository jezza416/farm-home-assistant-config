    name: "Tank Pump Feed Meter Count"
    pin: GPIO34
    update_interval: 10s
    id: tank_3a_meter
    unit_of_measurement: "Litres"
    filters:
      - lambda: |-
          id(meter_3a_float) += x / 2469.1;   
          return id(meter_3a_float);
#         id(meter_3a_float) += x / 0;

  - platform: template
    name: "Last Meter Count"
    id: meter_3a_last_run
    unit_of_measurement: "Litres"
    accuracy_decimals: 2

  - platform: template
    name: "Current Time"
    id: time_now
    unit_of_measurement: "O'Clock"
    accuracy_decimals: 2
     
  - platform: template
    name: "Circ Remaining Timer"
    id: circ_r_time
    unit_of_measurement: "Mins"
    accuracy_decimals: 2

number:
  - platform: template
    name: Circulation Pump Off
    id: circ_on
    optimistic: true
    min_value: 0
    max_value: 360
    step: 1
    restore_value: true
    unit_of_measurement: Mins
    mode: box
    
  - platform: template
    name: Circulation Pump On
    id: circ_off
    optimistic: true
    min_value: 0
    max_value: 60
    step: 1
    restore_value: true
    unit_of_measurement: Mins
    mode: box
  
          
