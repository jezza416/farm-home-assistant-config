switch:
  - platform: gpio
    pin: GPIO32
    name: "Circulation Pump Base"
    id: pump_base
    inverted: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: |-
          if (id(use_base).state);
            id(circ_r_time).publish_state(id(circ_off).state);
    on_turn_off:
      - lambda: |-
          if (id(use_base).state);
            id(circ_r_time).publish_state(id(circ_on).state);
  
  - platform: gpio
    pin: GPIO03
    name: "Drain Pump"
    id: drain_pump
    inverted: true
    restore_mode: RESTORE_DEFAULT_OFF
    
  - platform: gpio
    pin: GPIO25
    name: "Circulation Internal Pump"
    id: pump_circ1
    inverted: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: |-
          if (id(use_base).state){
            ESP_LOGI("main", "dont reset wait till base pump");
          } else {
            id(circ_r_time).publish_state(id(circ_off).state);
          }   
    on_turn_off:
      - lambda: |-
          if (id(use_base).state){
            ESP_LOGI("main", "dont reset wait till base pump");
          } else {
            id(circ_r_time).publish_state(id(circ_on).state);
          }   

  
  - platform: template
    name: "Meter 3a Reset"
    id: reset_3a_meter
    turn_on_action:
      - switch.template.publish:
          id: reset_3a_meter
          state: ON
      - delay: 10s
      - lambda: |-
                id(meter_3a_last_run).publish_state(id(tank_3a_meter).state);
                id(meter_3a_float) = 0;
                id(tank_3a_meter).publish_state(0);
      - switch.turn_off: reset_3a_meter
    turn_off_action:
      - switch.template.publish:
          id: reset_3a_meter
          state: OFF  
  
  - platform: template
    name: "Drain/Empty Tank"
    id: drain_tank
    restore_state: yes
    turn_on_action:
      - lambda: |- 
          if (id(empty_tank).state){
            id(drain_pump).turn_off();
          } else {
            id(drain_pump).turn_on();
          }
      - switch.template.publish:
          id: drain_tank
          state: ON
    turn_off_action:
      - switch.turn_off: drain_pump
      - switch.template.publish:
          id: drain_tank
          state: OFF

  - platform: template
    name: "Use Internal Pump"
    id: use_int
    turn_on_action:
      - switch.template.publish:
          id: use_int
          state: ON
    turn_off_action:
      - switch.template.publish:
          id: use_int
          state: OFF  
  
  - platform: template
    name: "Use Base Pump"
    id: use_base
    turn_on_action:
      - switch.template.publish:
          id: use_base
          state: ON
    turn_off_action:
      - switch.template.publish:
          id: use_base
          state: OFF  
  

  - platform: template
    name: "Auto Mixing Tank Pumps"
    id: auto_pumps
    restore_state: yes
    turn_on_action:
      - switch.template.publish:
          id: auto_pumps
          state: ON
      - lambda: |-
          if (id(use_base).state) {
              if (id(use_int).state) {
                id(pump_circ1).turn_on();
                ESP_LOGI("main", "got both on");
              } else { 
                id(pump_base).turn_on();
                ESP_LOGI("main", "got base on");
              }
          if (id(use_int).state){
              id(pump_circ1).turn_on();
              ESP_LOGI("main", "got int on");
             } else {
              id(use_int).turn_on();
              id(pump_circ1).turn_on();
              ESP_LOGI("main", "None on so set int to on");
             }
  
    turn_off_action:
      - switch.template.publish:
          id: auto_pumps
          state: OFF
      - lambda: |-
          if (id(use_base).state) {
              id(pump_base).turn_off();
              ESP_LOGI("main", "got base off");
             } 
          if (id(use_int).state) {
              id(pump_circ1).turn_off();
              ESP_LOGI("main", "got int off");
             } 
            
