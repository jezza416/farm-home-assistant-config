time:
  - platform: sntp
    id: sntp_time
    on_time:
      - seconds: 0
        minutes: '0-59'
        then:
          - lambda: |-
              static float hour = 0;
              static float min = 0;
              static float time = 0; 
              static int day = 0;
              static float timer_1 = 0;
              static float timer_2 = 0;
              static float timer_3 = 0;
              static float timer_4 = 0;
              static float timer_5 = 0;
              static float timer_6 = 0;
              static float timer_7 = 0;
              static float timer_8 = 0;
              static float timer_9 = 0;
              static float timer_10 = 0;
              static float timer_11 = 0;
              static float timer_12 = 0;
              static float circ_rem = 0;
              static float litre_1 = 0;
              static float litre_2 = 0;
              static float litre_3 = 0;
              
              
              
              hour = id(sntp_time).now().hour;
              min = id(sntp_time).now().minute;
              day = id(sntp_time).now().day_of_week;
              time = hour + (min / 100);
              circ_rem = id(circ_r_time).state;
              
              
              id(time_now).publish_state(time);

              if (id(auto_pumps).state){
                  if (id(pump_circ1).state){
                      if (circ_rem == 0){
                        id(pump_circ1).turn_off();
                      } else {
                        id(circ_r_time).publish_state(circ_rem -= 1);
                      }  
                } else {
                      if (circ_rem == 0){
                        id(pump_circ1).turn_on();
                      } else {
                        id(circ_r_time).publish_state(circ_rem -= 1);
                      }
                }
              }





             

             

binary_sensor:
  - platform: template
    name: "Tank Has Min Liters"
    id: tank_good
    lambda: |-
      if (id(l_litres).state > 10) {
        // Garage Door is open.
        return true;
      } else {
        // Garage Door is closed.
        return false;
      }
    on_press:
       - lambda: |-
          id(auto_pumps).turn_on();


  - platform: template
    name: "Low Water Waring"
    id: low_tank
    lambda: |-
      if (id(l_litres).state < 20) {
        // Garage Door is open.
        return true;
      } else {
        // Garage Door is closed.
        return false;
      }
    
  - platform: template
    name: "No Water Waring"
    id: empty_tank
    lambda: |-
      if (id(l_litres).state < 2) {
        // Garage Door is open
        return true;
      } else {
        // Garage Door is closed.
        return false;
      }
    on_press:
      - switch.turn_off: pump_base
      - switch.turn_off: pump_circ1
      - lambda: |-
          if (id(drain_tank).state){
              id(drain_tank).turn_off();
          }
          
globals:
    
  - id: meter_3a_float
    type: float
    restore_value: no
    initial_value: '0'

  - id: circ_time_on
    type: int
    restore_value: yes
    
  - id: circ_time_off
    type: int
    restore_value: yes
    
  - id: intival_time_3a
    type: float
    restore_value: yes

  